<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Slumber — v23: Timeline Editor</title><style>
:root{--bg:#130e12;--bg2:#1c1418;--text:#eee4e8;--text2:#a89098;--text3:#685058;--accent:#b898a0;--accent-glow:rgba(184,152,160,.14);--card-bg:rgba(22,16,20,.7);--card-border:rgba(184,152,160,.08);--radius:20px;--radius-sm:14px;--radius-pill:24px;--font:'Segoe UI',system-ui,sans-serif;--topbar-h:54px;--nav-h:66px;--touch-min:44px;--input-h:62px}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}svg{fill:none}html,body{height:100%;overflow:hidden;font-family:var(--font);background:#0c0a0e;color:var(--text)}body{display:flex;justify-content:center;align-items:center}body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 45% 40% at 30% 15%,rgba(160,120,140,.03),transparent 60%)}.phone{width:390px;height:844px;background:var(--bg);border-radius:28px;position:relative;overflow:hidden;z-index:1;box-shadow:0 0 0 1px rgba(184,152,160,.04),0 20px 60px rgba(0,0,0,.55)}.topbar{position:absolute;top:0;left:0;right:0;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:100;background:rgba(19,14,18,.75);backdrop-filter:blur(20px);border-bottom:1px solid var(--card-border)}.topbar .logo{font-size:18px;font-weight:700}.topbar .logo span{color:var(--accent)}.topbar .icon-btn{width:var(--touch-min);height:var(--touch-min);display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;color:var(--text2)}.topbar .icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}.bottomnav{position:absolute;bottom:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:flex-start;justify-content:space-around;background:rgba(19,14,18,.75);backdrop-filter:blur(20px);z-index:100;border-top:1px solid var(--card-border);padding-top:8px}.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text3);font-size:10px;padding:4px 0 8px;min-width:60px;position:relative}.nav-item::after{content:'';width:24px;height:3px;border-radius:3px;background:transparent;position:absolute;bottom:0}.nav-item.active{color:var(--accent);font-weight:600}.nav-item.active::after{background:var(--accent)}.nav-item svg{width:20px;height:20px;opacity:.5}.nav-item.active svg{opacity:1}
.fab{position:absolute;bottom:calc(var(--nav-h)+18px);right:22px;width:56px;height:56px;border-radius:50%;background:rgba(184,152,160,.18);border:1.5px solid rgba(184,152,160,.22);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:120}.fab:active{transform:scale(.88)}.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2}.fab-label{position:absolute;right:64px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--accent)}.page{display:none;padding:14px 20px 20px;min-height:100%;position:relative;z-index:2}.page.active{display:block}.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:16px;margin-bottom:12px}.btn-pill{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);min-height:var(--touch-min);border:1.5px solid rgba(184,152,160,.15);background:rgba(184,152,160,.08);color:var(--accent)}.btn-pill.primary{background:rgba(184,152,160,.15);border-color:rgba(184,152,160,.25)}.btn-full{width:100%;justify-content:center;margin-bottom:8px}
.page#onboarding{padding-top:60px}#onboarding.active~.topbar,#onboarding.active~.bottomnav,#onboarding.active~.fab{display:none}#onboarding.active~.topbar{display:flex;background:transparent;border:none}#onboarding.active~.topbar .logo{opacity:0}.onboard-step{display:none;animation:fadeUp .3s ease}.onboard-step.active{display:block}@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.ob-kicker{font-size:10px;text-transform:uppercase;letter-spacing:3px;color:var(--text3);margin-bottom:18px}.ob-title{font-size:26px;font-weight:700;line-height:1.3;margin-bottom:10px}.ob-line{width:36px;height:2px;background:var(--accent);margin-bottom:22px;opacity:.4}
.hero-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:20px 18px;margin-bottom:12px}.hero-stat{font-size:44px;font-weight:200;letter-spacing:-2px}.hero-stat .unit{font-size:16px;color:var(--text2)}.dump-pill{display:flex;align-items:center;gap:10px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-pill);padding:6px 6px 6px 18px;margin-bottom:12px}.dump-pill input{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;outline:none;font-family:var(--font)}.dump-pill .send-pill{width:38px;height:38px;border-radius:50%;background:rgba(184,152,160,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent);flex-shrink:0}.dump-pill .send-pill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}
.dump-chat-area{display:flex;flex-direction:column;gap:10px;max-height:100%;overflow-y:auto;padding:0 0 calc(var(--input-h)+12px) 0}.dump-bubble{max-width:85%;padding:12px 16px;border-radius:var(--radius);font-size:14px}.dump-bubble.mine{align-self:flex-end;background:rgba(184,152,160,.08);border:1px solid rgba(184,152,160,.12);border-bottom-right-radius:6px;color:var(--text)}.dump-bubble .bubble-time{font-size:9px;color:var(--text3);margin-top:4px;text-align:right}.dump-input-bar{position:absolute;bottom:0;left:0;right:0;height:var(--input-h);display:flex;gap:8px;align-items:center;background:var(--card-bg);backdrop-filter:blur(16px);border-top:1px solid var(--card-border);padding:8px 16px;z-index:50}.dump-input-bar textarea{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;outline:none;font-family:var(--font);resize:none;padding:6px 0;line-height:1.5;min-height:20px;max-height:44px}.dump-input-bar .send-round{width:40px;height:40px;border-radius:50%;background:rgba(184,152,160,.14);border:1px solid rgba(184,152,160,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent)}.dump-input-bar .send-round svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}

/* === v23: SLEEP TIMELINE EDITOR (Layout change) === */
.timeline-editor{display:flex;flex-direction:column;gap:0;position:relative;padding-left:28px}
.timeline-editor::before{content:'';position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:rgba(184,152,160,.15);border-radius:1px}
.te-node{display:flex;align-items:center;gap:12px;padding:12px 0;position:relative;cursor:pointer}
.te-node::before{content:'';position:absolute;left:-21px;top:50%;transform:translateY(-50%);width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--text3);z-index:1}
.te-node.active::before{background:var(--accent);border-color:var(--accent)}
.te-node .te-time{font-size:16px;font-weight:600;min-width:48px;color:var(--text)}
.te-node .te-action{font-size:13px;color:var(--text2);flex:1}
.te-node .te-edit{color:var(--text3);font-size:18px;opacity:0;transition:opacity .2s;padding:8px}
.te-node:hover .te-edit{opacity:1}
.te-add{display:flex;align-items:center;gap:12px;padding:14px 0;cursor:pointer;position:relative}
.te-add::before{content:'+';position:absolute;left:-21px;top:50%;transform:translateY(-50%);width:14px;height:14px;border-radius:50%;border:1px dashed var(--text3);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text3);text-align:center;line-height:14px;background:var(--bg)}
.te-add .te-add-label{font-size:13px;color:var(--text3)}
.te-now-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;margin:16px 0 16px 28px;border-radius:var(--radius-pill);background:rgba(184,152,160,.1);border:1px solid rgba(184,152,160,.18);color:var(--accent);font-size:14px;font-weight:600;cursor:pointer}

.checkpoint-row{display:flex;gap:10px;margin-bottom:12px}.cp-card{flex:1;padding:16px;border-radius:var(--radius);text-align:center;cursor:pointer;font-weight:600;font-size:14px;min-height:var(--touch-min);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card-bg);border:1.5px solid var(--card-border)}.cp-card.cp-wake{border-color:rgba(184,152,160,.2);color:var(--accent)}.cp-sub{font-size:10px;opacity:.5;margin-top:2px}
.awake-alert{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-pill);padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2)}.awake-alert .aw-link{color:var(--accent);cursor:pointer;margin-left:auto}
.wd-countdown{text-align:center}.wd-circle{width:150px;height:150px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:var(--card-bg);border:1px solid var(--card-border)}.wd-circle-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1}.wd-circle-inner .big{font-size:52px;font-weight:200}.wd-circle-inner .small{font-size:13px;color:var(--text2);margin-top:4px}.wd-cog{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer}.wd-cog:hover{border-color:var(--accent)}.wd-cog .cog-icon{font-size:28px;margin-bottom:8px}</style></head><body><div class="phone">
<div class="page active" id="onboarding"><div class="onboard-step active"><div class="ob-kicker">01 · Sleep Well</div><div class="ob-title">時間軸編輯器<br>直覺管理作息</div><div class="ob-line"></div><div class="ob-sub" style="color:var(--text2);font-size:14px;line-height:1.5;margin-bottom:22px">睡眠頁以時間軸呈現，撳一下編輯、拉一下調整。比兩粒大掣更直覺。</div><button class="btn-pill primary btn-full" onclick="finishOnboard()">開始使用</button></div></div>
<div class="page" id="dashboard"><div class="hero-card"><div style="font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:8px">今晚目標</div><div class="hero-stat">7<span class="unit">h</span> 30<span class="unit">m</span></div><div style="font-size:12px;color:var(--text2)">23:30 入睡 · 07:00 起身</div></div><div class="dump-pill"><input type="text" placeholder="將腦裡面嘅嘢寫低..."><div class="send-pill" onclick="navigate('brain-dump')"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7"/></svg></div></div><div class="checkpoint-row"><div class="cp-card cp-wake" onclick="navigate('sleep')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/></svg>起身<div class="cp-sub">記錄起床</div></div><div class="cp-card" onclick="navigate('sleep')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>準備瞓<div class="cp-sub">睡前放鬆</div></div></div></div>
<div class="page" id="brain-dump"><div class="dump-chat-area" id="dumpChat"><div class="dump-bubble mine"><div>聽日個 presentation</div><div class="bubble-time">22:45</div></div></div><div class="dump-input-bar"><textarea id="dumpText" placeholder="寫低你嘅雜念..." rows="1" oninput="this.style.height='';this.style.height=Math.min(this.scrollHeight,44)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();addDump()}"></textarea><div class="send-round" onclick="addDump()"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/></svg></div></div></div>
<!-- v23: SLEEP TIMELINE EDITOR -->
<div class="page" id="sleep"><div class="timeline-editor"><div class="te-node active"><div class="te-time">07:15</div><div class="te-action">起身 ☀️</div><div class="te-edit">⋯</div></div><div class="te-node"><div class="te-time">23:45</div><div class="te-action">準備入睡 🌙</div><div class="te-edit">⋯</div></div><div class="te-node"><div class="te-time">01:30</div><div class="te-action" style="color:var(--text3)">半夜醒咗</div><div class="te-edit">⋯</div></div><div class="te-add" onclick="alert('手動添加記錄')"><div class="te-add-label">+ 手動添加記錄</div></div><div class="te-now-btn" onclick="checkpoint(new Date().getHours()>18?'sleep':'wake')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>記錄現在</div></div><div class="awake-alert" style="margin:12px 0 0 28px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>仲未瞓著？<span class="aw-link" onclick="stillAwake()">修正</span></div></div>
<div class="page" id="wind-down"><div class="wd-countdown" style="margin-bottom:22px"><div class="wd-circle"><div class="wd-circle-inner"><span class="big">10</span><span class="small">mins left</span></div></div></div><div class="wd-cog" onclick="alert('引導式認知重構練習')"><div class="cog-icon">🧘</div><div class="cog-title" style="font-size:15px;font-weight:600">認知重構引導</div><div style="font-size:12px;color:var(--text2);margin-top:4px">3 分鐘練習</div></div></div>
<div class="page" id="settings"><div class="card"><div style="font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--text3);margin-bottom:6px">作息</div><div style="padding:12px 0;border-bottom:1px solid var(--card-border)">作息模式</div></div></div>
<div class="topbar"><div class="logo">slumber<span>.</span></div></div>
<div class="bottomnav"><div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>首頁</div><div class="nav-item" data-page="brain-dump" onclick="navigate('brain-dump')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/></svg>記錄</div><div class="nav-item" data-page="sleep" onclick="navigate('sleep')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>睡眠</div><div class="nav-item" data-page="settings" onclick="navigate('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/></svg>我的</div></div>
<button class="fab" onclick="quickDump()"><span class="fab-label">Brain Dump</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>
<script>var s=1;function navigate(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});document.getElementById(id).classList.add('active');document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active')});var nav=document.querySelector('.nav-item[data-page="'+id+'"]');if(nav)nav.classList.add('active')}function finishOnboard(){navigate('dashboard')}function quickDump(){navigate('brain-dump');setTimeout(function(){var t=document.getElementById('dumpText');if(t)t.focus()},200)}function addDump(){var t=document.getElementById('dumpText');var chat=document.getElementById('dumpChat');if(t&&t.value.trim()&&chat){var now=new Date();var time=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');var b=document.createElement('div');b.className='dump-bubble mine';b.innerHTML='<div>'+t.value.trim()+'</div><div class="bubble-time">'+time+'</div>';chat.appendChild(b);chat.scrollTop=chat.scrollHeight;t.value='';t.style.height=''}}function checkpoint(type){alert(type==='wake'?'已記錄起床時間':'已記錄準備入睡')}function stillAwake(){alert('已修正')}</script></body></html>
