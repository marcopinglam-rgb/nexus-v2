);if(t)t.focus()},200)}function addDump(){var t=document.getElementById("dumpText");var chat=document.getElementById("dumpChat");if(t&&t.value.trim()&&chat){var now=new Date();var time=now.getHours().toString().padStart(2,"0")+":"+now.getMinutes().toString().padStart(2,"0");var b=document.createElement("div");b.className="dump-bubble mine";b.innerHTML="<div>"+t.value.trim()+"</div><div class='bubble-time'>"+time+"</div>";chat.appendChild(b);chat.scrollTop=chat.scrollHeight;t.value="";t.style.height=""}}function checkpoint(type){alert(type==="wake"?"已記錄起床時間":"已記錄準備入睡")}function stillAwake(){alert("已修正")}function selectLang(el){el.parentElement.querySelectorAll(".lang-chip").forEach(function(c){c.classList.remove("active")});el.classList.add("active")}</script></body></html>
