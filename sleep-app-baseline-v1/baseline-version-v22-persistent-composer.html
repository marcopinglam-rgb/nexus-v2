<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Slumber — v22: Persistent Composer</title><style>
:root{--bg:#0e1410;--bg2:#141c16;--text:#e4ece6;--text2:#8aa090;--text3:#4a6858;--accent:#7aaa84;--accent-glow:rgba(122,170,132,.14);--card-bg:rgba(18,24,20,.7);--card-border:rgba(122,170,132,.07);--radius:20px;--radius-sm:14px;--radius-pill:24px;--font:'Segoe UI',system-ui,sans-serif;--topbar-h:54px;--nav-h:66px;--touch-min:44px;--composer-h:56px}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}svg{fill:none}html,body{height:100%;overflow:hidden;font-family:var(--font);background:#0a100c;color:var(--text)}body{display:flex;justify-content:center;align-items:center}body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 50% 40% at 30% 15%,rgba(80,140,100,.03),transparent 60%)}.phone{width:390px;height:844px;background:var(--bg);border-radius:28px;position:relative;overflow:hidden;z-index:1;box-shadow:0 0 0 1px rgba(122,170,132,.04),0 20px 60px rgba(0,0,0,.55)}.topbar{position:absolute;top:0;left:0;right:0;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:100;background:rgba(14,20,16,.75);backdrop-filter:blur(20px);border-bottom:1px solid var(--card-border)}.topbar .logo{font-size:18px;font-weight:700}.topbar .logo span{color:var(--accent)}.topbar .icon-btn{width:var(--touch-min);height:var(--touch-min);display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;color:var(--text2)}.topbar .icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}.bottomnav{position:absolute;bottom:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:flex-start;justify-content:space-around;background:rgba(14,20,16,.75);backdrop-filter:blur(20px);z-index:100;border-top:1px solid var(--card-border);padding-top:8px}.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text3);font-size:10px;padding:4px 0 8px;min-width:60px;position:relative}.nav-item::after{content:'';width:24px;height:3px;border-radius:3px;background:transparent;position:absolute;bottom:0;transition:all .25s}.nav-item.active{color:var(--accent);font-weight:600}.nav-item.active::after{background:var(--accent)}.nav-item svg{width:20px;height:20px;opacity:.5;transition:all .25s}.nav-item.active svg{opacity:1}.page{display:none;padding:14px 20px 20px;min-height:100%;position:relative;z-index:2}.page.active{display:block}.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:16px;margin-bottom:12px}.btn-pill{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);min-height:var(--touch-min);border:1.5px solid rgba(122,170,132,.15);background:rgba(122,170,132,.08);color:var(--accent)}.btn-pill.primary{background:rgba(122,170,132,.15);border-color:rgba(122,170,132,.25)}.btn-full{width:100%;justify-content:center;margin-bottom:8px}
.page#onboarding{padding-top:60px}#onboarding.active~.topbar,#onboarding.active~.bottomnav,#onboarding.active~.composer-bar{display:none}#onboarding.active~.topbar{display:flex;background:transparent;border:none}#onboarding.active~.topbar .logo{opacity:0}.onboard-step{display:none;animation:fadeUp .3s ease}.onboard-step.active{display:block}@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.ob-kicker{font-size:10px;text-transform:uppercase;letter-spacing:3px;color:var(--text3);margin-bottom:18px}.ob-title{font-size:26px;font-weight:700;line-height:1.3;margin-bottom:10px}.ob-sub{color:var(--text2);font-size:14px;line-height:1.5;margin-bottom:22px}.ob-line{width:36px;height:2px;background:var(--accent);margin-bottom:22px}

/* === v22: PERSISTENT COMPOSER (replaces FAB) === */
.composer-bar{position:absolute;bottom:var(--nav-h);left:0;right:0;height:var(--composer-h);display:flex;align-items:center;gap:8px;background:var(--card-bg);backdrop-filter:blur(16px);border-top:1px solid var(--card-border);padding:6px 14px;z-index:90}
.composer-bar input{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;outline:none;font-family:var(--font)}.composer-bar input::placeholder{color:var(--text3)}
.composer-bar .composer-send{width:40px;height:40px;border-radius:50%;background:rgba(122,170,132,.15);border:1px solid rgba(122,170,132,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent);flex-shrink:0}.composer-bar .composer-send svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}
/* Hide FAB — no FAB in this version */
.fab{display:none}

.hero-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:20px 18px;margin-bottom:12px}.hero-stat{font-size:44px;font-weight:200;letter-spacing:-2px;margin-bottom:6px}.hero-stat .unit{font-size:16px;color:var(--text2)}.checkpoint-row{display:flex;gap:10px;margin-bottom:12px}.cp-card{flex:1;padding:16px;border-radius:var(--radius);text-align:center;cursor:pointer;font-weight:600;font-size:14px;min-height:var(--touch-min);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card-bg);border:1.5px solid var(--card-border)}.cp-card.cp-wake{border-color:rgba(122,170,132,.2);color:var(--accent)}.cp-sub{font-size:10px;opacity:.5;margin-top:2px}.trend-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:14px 16px}.trend-bars{display:flex;align-items:flex-end;gap:5px;height:36px}.trend-bars .tb{flex:1;background:rgba(122,170,132,.1);border-radius:6px 6px 0 0}.trend-bars .tb.today{background:var(--accent)}.trend-labels{display:flex;gap:5px;margin-top:4px}.trend-labels span{flex:1;text-align:center;font-size:9px;color:var(--text3)}

/* Dump bubble list */
.dump-list{display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding:0 0 8px 0}.dump-bubble{max-width:85%;padding:12px 16px;border-radius:var(--radius);font-size:14px;line-height:1.5}.dump-bubble.mine{align-self:flex-end;background:rgba(122,170,132,.08);border:1px solid rgba(122,170,132,.12);border-bottom-right-radius:6px;color:var(--text)}.dump-bubble .bubble-time{font-size:9px;color:var(--text3);margin-top:4px;text-align:right}

.sleep-pills{display:flex;gap:10px;margin-bottom:18px}.sleep-pill-btn{flex:1;padding:18px 12px;border-radius:var(--radius-pill);text-align:center;cursor:pointer;font-weight:600;font-size:14px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card-bg);border:1.5px solid var(--card-border)}.sp-wake{border-color:rgba(122,170,132,.2);color:var(--accent)}.sp-sub{font-size:10px;opacity:.5;margin-top:2px}.awake-alert{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-pill);padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2)}.awake-alert .aw-link{color:var(--accent);cursor:pointer;margin-left:auto}.timeline-diary{margin-bottom:14px}.tl-node{display:flex;gap:14px;margin-bottom:4px}.tl-node::before{content:'';position:absolute;left:7px;top:24px;bottom:-4px;width:2px;background:rgba(122,170,132,.12)}.tl-dot{width:16px;height:16px;min-width:16px;border-radius:50%;background:var(--card-bg);border:2px solid var(--accent);margin-top:4px}.tl-dot.active{background:var(--accent)}.tl-node-content{flex:1;padding:10px 14px;border-radius:var(--radius-sm);background:var(--card-bg);border:1px solid var(--card-border);font-size:13px;margin-bottom:8px}.wd-countdown{text-align:center;margin-bottom:22px}.wd-circle{width:150px;height:150px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:var(--card-bg);border:1px solid var(--card-border)}.wd-circle-inner{display:flex;flex-direction:column;align-items:center;justify-content:center}.wd-circle-inner .big{font-size:52px;font-weight:200}.wd-circle-inner .small{font-size:13px;color:var(--text2);margin-top:4px}.wd-bar-row{display:flex;gap:5px;max-width:220px;margin:0 auto}.wd-bar{height:5px;flex:1;border-radius:3px;background:rgba(255,255,255,.03)}.wd-bar.done{background:rgba(122,170,132,.35)}.wd-bar.active{background:var(--accent)}.wd-cog{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer}.wd-cog:hover{border-color:var(--accent)}.wd-cog .cog-icon{font-size:28px}.settings-section{margin-bottom:26px}.settings-section h3{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--text3)}.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--card-border)}.lang-chips{display:flex;gap:8px}.lang-chip{padding:10px 18px;border-radius:var(--radius-pill);font-size:13px;cursor:pointer;color:var(--text2);background:var(--card-bg);border:1px solid var(--card-border);min-height:var(--touch-min);display:flex;align-items:center}.lang-chip.active{border-color:var(--accent);color:var(--accent)}
/* Bottom padding for composer */
.page-content{padding-bottom:calc(var(--composer-h)+8px)}</style></head><body><div class="phone">
<div class="page active" id="onboarding"><div class="onboard-step active"><div class="ob-kicker">01 · Sleep Well</div><div class="ob-title">隨時輸入<br>唔使搵掣</div><div class="ob-line"></div><div class="ob-sub">每個頁面底部都有輸入欄。諗到咩就即刻寫低，唔使撳 FAB。</div><button class="btn-pill primary btn-full" onclick="finishOnboard()">開始使用</button></div></div>
<div class="page" id="dashboard"><div class="page-content"><div class="hero-card"><div style="font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:8px">今晚目標</div><div class="hero-stat">7<span class="unit">h</span> 30<span class="unit">m</span></div><div style="font-size:12px;color:var(--text2)">23:30 入睡 · 07:00 起身</div></div><div class="checkpoint-row"><div class="cp-card cp-wake" onclick="navigate('sleep')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/></svg>起身<div class="cp-sub">記錄起床</div></div><div class="cp-card" onclick="navigate('sleep')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>準備瞓<div class="cp-sub">睡前放鬆</div></div></div><div class="trend-card"><h4 style="font-size:12px;font-weight:600;margin-bottom:8px;color:var(--text2)">本週趨勢</h4><div class="trend-bars"><div class="tb" style="height:60%"></div><div class="tb" style="height:45%"></div><div class="tb" style="height:70%"></div><div class="tb" style="height:55%"></div><div class="tb" style="height:80%"></div><div class="tb today" style="height:65%"></div><div class="tb" style="height:50%"></div></div><div class="trend-labels"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div></div></div></div>
<div class="page" id="brain-dump"><div class="page-content"><div class="dump-list" id="dumpList"><div class="dump-bubble mine"><div>聽日個 presentation 仲有幾頁</div><div class="bubble-time">22:45</div></div></div></div></div>
<div class="page" id="sleep"><div class="page-content"><div class="sleep-pills"><div class="sleep-pill-btn sp-wake" onclick="checkpoint('wake')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/></svg>起身<span class="sp-sub">記錄起床</span></div><div class="sleep-pill-btn" onclick="checkpoint('sleep')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>準備瞓<span class="sp-sub">睡前放鬆</span></div></div><div class="awake-alert"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>仲未瞓著？<span class="aw-link" onclick="stillAwake()">修正</span></div><div class="timeline-diary"><div class="tl-node"><div class="tl-dot active"></div><div class="tl-node-content"><div style="font-size:11px;color:var(--text3);font-weight:600">23:45</div><div>準備入睡</div></div></div><div class="tl-node" onclick="alert('手動添加記錄')"><div class="tl-dot" style="border-color:var(--text3)"></div><div class="tl-node-content" style="opacity:.35;cursor:pointer"><div style="font-size:11px;color:var(--text3)">+</div><div style="color:var(--text3)">手動添加記錄</div></div></div></div></div></div>
<div class="page" id="wind-down"><div class="page-content"><div class="wd-countdown"><div class="wd-circle"><div class="wd-circle-inner"><span class="big">10</span><span class="small">mins left</span></div></div><div class="wd-bar-row"><div class="wd-bar done"></div><div class="wd-bar done"></div><div class="wd-bar done"></div><div class="wd-bar done"></div><div class="wd-bar done"></div><div class="wd-bar active"></div><div class="wd-bar"></div><div class="wd-bar"></div><div class="wd-bar"></div><div class="wd-bar"></div></div></div><div class="wd-cog" onclick="alert('認知重構練習')"><div class="cog-icon">🧘</div><div class="cog-title" style="font-size:15px;font-weight:600">認知重構引導</div><div style="font-size:12px;color:var(--text2);margin-top:4px">3 分鐘練習</div></div></div></div>
<div class="page" id="settings"><div class="page-content"><div class="settings-section"><h3>作息設定</h3><div class="setting-row"><span>作息模式</span><span style="color:var(--text2)">OT 不定時</span></div></div><div class="settings-section"><h3>語言</h3><div class="lang-chips"><div class="lang-chip active" onclick="selectLang(this)">粵語</div><div class="lang-chip" onclick="selectLang(this)">中文</div></div></div></div></div>
<div class="topbar"><div class="logo">slumber<span>.</span></div></div>
<div class="bottomnav"><div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>首頁</div><div class="nav-item" data-page="brain-dump" onclick="navigate('brain-dump')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/></svg>記錄</div><div class="nav-item" data-page="sleep" onclick="navigate('sleep')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>睡眠</div><div class="nav-item" data-page="settings" onclick="navigate('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/></svg>我的</div></div>
<!-- PERSISTENT COMPOSER (replaces FAB) -->
<div class="composer-bar"><input type="text" id="composerInput" placeholder="寫低你嘅雜念..."><div class="composer-send" onclick="quickDump()"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/></svg></div></div></div>
<script>var s=1;function navigate(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});document.getElementById(id).classList.add('active');document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active')});var nav=document.querySelector('.nav-item[data-page="'+id+'"]');if(nav)nav.classList.add('active')}function finishOnboard(){navigate('dashboard')}function quickDump(){var t=document.getElementById('composerInput');navigate('brain-dump');if(t&&t.value.trim()){var list=document.getElementById('dumpList');var now=new Date();var time=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');var b=document.createElement('div');b.className='dump-bubble mine';b.innerHTML='<div>'+t.value.trim()+'</div><div class="bubble-time">'+time+'</div>';list.insertBefore(b,list.firstChild);t.value=''}}function checkpoint(type){alert(type==='wake'?'已記錄起床時間':'已記錄準備入睡')}function stillAwake(){alert('已修正')}function selectLang(el){el.parentElement.querySelectorAll('.lang-chip').forEach(function(c){c.classList.remove('active')});el.classList.add('active')}</script></body></html>
