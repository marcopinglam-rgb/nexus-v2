<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Slumber — v37: Night Flow</title><style>
:root{--bg:#0a0e18;--bg2:#101420;--text:#e0e4ee;--text2:#8890a8;--text3:#485068;--accent:#6b7db8;--card-bg:rgba(14,18,28,.7);--card-border:rgba(107,125,184,.08);--radius:18px;--radius-sm:12px;--radius-pill:22px;--font:'Segoe UI',system-ui,sans-serif;--topbar-h:54px;--nav-h:66px;--touch-min:44px}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}svg{fill:none}html,body{height:100%;overflow:hidden;font-family:var(--font);background:#060a12;color:var(--text)}body{display:flex;justify-content:center;align-items:center}body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 50% 45% at 30% 15%,rgba(80,100,160,.04),transparent 60%)}.phone{width:390px;height:844px;background:var(--bg);border-radius:28px;position:relative;overflow:hidden;z-index:1}.topbar{position:absolute;top:0;left:0;right:0;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:100;background:rgba(10,14,24,.75);border-bottom:1px solid var(--card-border)}.topbar .logo{font-size:18px;font-weight:700}.topbar .logo span{color:var(--accent)}.bottomnav{position:absolute;bottom:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:flex-start;justify-content:space-around;background:rgba(10,14,24,.85);z-index:100;border-top:1px solid var(--card-border);padding-top:8px}.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text3);font-size:10px;padding:4px 0 8px;min-width:52px}.nav-item.active{color:var(--accent);font-weight:600}.nav-item svg{width:20px;height:20px;opacity:.5}.nav-item.active svg{opacity:1}.nav-plus{display:flex;flex-direction:column;align-items:center;cursor:pointer;margin-top:-18px;z-index:101}.nav-plus-circle{width:48px;height:48px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(107,125,184,.3)}.nav-plus-circle svg{width:24px;height:24px;stroke:#0a0e18;fill:none;stroke-width:3}.nav-plus-label{font-size:10px;color:var(--accent);margin-top:2px;font-weight:600}
.composer-panel{display:none;position:absolute;bottom:var(--nav-h);left:0;right:0;background:var(--card-bg);border-top:1px solid var(--card-border);padding:10px 14px;z-index:95}.composer-panel.show{display:block}.composer-inner{display:flex;flex-direction:column;gap:8px}.composer-input-row{display:flex;gap:8px;align-items:center;background:rgba(107,125,184,.06);border:1px solid rgba(107,125,184,.15);border-radius:22px;padding:4px 4px 4px 16px}.composer-input-row textarea{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;outline:none;font-family:var(--font);resize:none;padding:8px 0;line-height:1.4;min-height:20px;max-height:48px}.composer-actions{display:flex;gap:6px;justify-content:flex-end}.composer-btn{display:flex;align-items:center;gap:4px;padding:8px 14px;border-radius:22px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--card-border);background:var(--card-bg);color:var(--text2);min-height:36px}.composer-btn.send{background:var(--accent);color:#0a0e18;border:none}
.page{display:none;padding:14px 18px 20px;min-height:100%;position:relative;z-index:2}.page.active{display:block}.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:14px;margin-bottom:10px}.page#onboarding{padding-top:60px}#onboarding.active~.topbar,#onboarding.active~.bottomnav{display:none}#onboarding.active~.topbar{display:flex;background:transparent;border:none}#onboarding.active~.topbar .logo{opacity:0}.ob-kicker{font-size:10px;text-transform:uppercase;letter-spacing:3px;color:var(--text3);margin-bottom:18px}.ob-title{font-size:26px;font-weight:700;line-height:1.3;margin-bottom:10px}.ob-line{width:36px;height:2px;background:var(--accent);margin-bottom:22px;opacity:.4}.btn-pill{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:22px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);min-height:44px;border:1.5px solid rgba(107,125,184,.15);background:rgba(107,125,184,.08);color:var(--accent)}.btn-pill.primary{background:rgba(107,125,184,.15);border-color:rgba(107,125,184,.25)}.btn-full{width:100%}
.cp-hero{display:flex;gap:12px;margin-bottom:12px}.cp-hero-btn{flex:1;padding:22px 14px;border-radius:var(--radius);text-align:center;cursor:pointer;font-weight:700;font-size:15px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card-bg);border:2px solid var(--card-border)}.cp-hero-btn.cp-wake{border-color:rgba(107,125,184,.25);color:var(--accent);background:rgba(107,125,184,.06)}.cp-hero-sub{font-size:11px;opacity:.5;margin-top:4px}
.dump-display{flex:1;overflow-y:auto;padding-bottom:8px}.dump-bubble{max-width:85%;padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:8px}.dump-bubble.mine{margin-left:auto;background:rgba(107,125,184,.08);border:1px solid rgba(107,125,184,.12);border-bottom-right-radius:6px;color:var(--text)}.dump-bubble .bubble-time{font-size:8px;color:var(--text3);margin-top:3px;text-align:right}
.sleep-pills{display:flex;gap:10px;margin-bottom:16px}.sleep-pill-btn{flex:1;padding:16px;border-radius:22px;text-align:center;cursor:pointer;font-weight:600;font-size:14px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card-bg);border:1.5px solid var(--card-border)}.sp-wake{border-color:rgba(107,125,184,.2);color:var(--accent)}.sp-sub{font-size:10px;opacity:.5}.tl-node{display:flex;gap:12px}.tl-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);margin-top:4px}.tl-dot.active{background:var(--accent)}.tl-node-content{flex:1;padding:10px 14px;border-radius:12px;background:var(--card-bg);border:1px solid var(--card-border);font-size:13px;margin-bottom:6px}.tl-node-content .tl-time{font-size:11px;color:var(--text3);font-weight:600}

/* v37: WIND-DOWN STEP FLOW */
.wd-step{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;text-align:center;min-height:calc(100% - var(--topbar-h) - 40px)}
.wd-step-num{font-size:48px;font-weight:200;margin-bottom:8px;opacity:.3}.wd-step-title{font-size:20px;font-weight:600;margin-bottom:6px}.wd-step-desc{font-size:13px;color:var(--text2);margin-bottom:24px;line-height:1.6;max-width:260px}.wd-step-btn{padding:14px 32px;border-radius:22px;font-size:15px;font-weight:600;cursor:pointer;background:var(--accent);color:#0a0e18;border:none;min-height:48px;display:flex;align-items:center;gap:8px}.wd-step-btn:active{opacity:.8}.wd-progress{display:flex;gap:6px;margin-top:24px}.wd-progress-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.06)}.wd-progress-dot.done{background:rgba(107,125,184,.3)}.wd-progress-dot.active{background:var(--accent)}</style></head><body><div class="phone">
<div class="page active" id="onboarding"><div class="ob-kicker">01 · Sleep Well</div><div class="ob-title">卸下思緒重量<br>找回入眠本能</div><div class="ob-line"></div><div style="color:var(--text2);font-size:14px;line-height:1.5;margin-bottom:22px">失眠嘅根源唔係你唔夠攰，而係腦入面太多嘢放唔低。我哋幫你喺睡前清空雜念，引導你一步步進入放鬆狀態。</div><button class="btn-pill primary btn-full" onclick="finishOnboard()">開始使用</button></div></div>
<div class="page" id="dashboard"><div class="cp-hero"><div class="cp-hero-btn cp-wake" onclick="navigate('sleep')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/></svg>起身<div class="cp-hero-sub">記錄起床</div></div><div class="cp-hero-btn" onclick="navigate('sleep')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>準備瞓<div class="cp-hero-sub">睡前放鬆</div></div></div></div>
<div class="page" id="brain-dump"><div style="display:flex;flex-direction:column;height:calc(100% - 12px)"><div class="dump-display" id="dumpDisplay"><div class="dump-bubble mine"><div>今日開會好攰</div><div class="bubble-time">22:45</div></div></div></div></div>
<div class="page" id="sleep"><div class="sleep-pills"><div class="sleep-pill-btn sp-wake" onclick="navigate('sleep')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/></svg>起身<span class="sp-sub">記錄起床</span></div><div class="sleep-pill-btn" onclick="navigate('sleep')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>準備瞓<span class="sp-sub">睡前放鬆</span></div></div><div class="tl-node"><div class="tl-dot active"></div><div class="tl-node-content"><div class="tl-time">23:45</div><div>準備入睡</div></div></div><div class="tl-node" onclick="alert('手動添加記錄')"><div class="tl-dot" style="border-color:var(--text3)"></div><div class="tl-node-content" style="opacity:.35;cursor:pointer"><div class="tl-time" style="color:var(--text3)">+</div><div style="color:var(--text3)">手動添加記錄</div></div></div></div>
<!-- v37: WIND-DOWN STEP FLOW -->
<div class="page" id="wind-down"><div class="wd-step" id="wdStep1"><div class="wd-step-num">01</div><div class="wd-step-title">放低手機</div><div class="wd-step-desc">將手機放喺床頭，深呼吸 3 次。你已經完成咗今日最重要嘅事。</div><button class="wd-step-btn" onclick="nextWdStep(2)">準備好咗 →</button><div class="wd-progress"><div class="wd-progress-dot active"></div><div class="wd-progress-dot"></div><div class="wd-progress-dot"></div></div></div>
<div class="wd-step" id="wdStep2" style="display:none"><div class="wd-step-num">02</div><div class="wd-step-title">回顧今日</div><div class="wd-step-desc">諗一樣今日令你感恩嘅事。唔使好大，細微嘅都可以。</div><button class="wd-step-btn" onclick="nextWdStep(3)">諗到咗 →</button><div class="wd-progress"><div class="wd-progress-dot done"></div><div class="wd-progress-dot active"></div><div class="wd-progress-dot"></div></div></div>
<div class="wd-step" id="wdStep3" style="display:none"><div class="wd-step-num">03</div><div class="wd-step-title">準備入眠</div><div class="wd-step-desc">仲有嘢困擾緊你？試吓認知重構練習，3 分鐘釋放剩餘思緒。</div><button class="wd-step-btn" onclick="alert('🧘 開始認知重構練習')">開始練習 🧘</button><div class="wd-progress"><div class="wd-progress-dot done"></div><div class="wd-progress-dot done"></div><div class="wd-progress-dot active"></div></div></div></div>
<div class="page" id="settings"><div style="padding:14px 18px"><div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:16px"><div style="font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--text3);margin-bottom:6px">作息設定</div><div style="padding:12px 0;border-bottom:1px solid var(--card-border)">作息模式</div></div></div></div>
<div class="topbar"><div class="logo">slumber<span>.</span></div></div>
<div class="bottomnav"><div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/></svg>首頁</div><div class="nav-item" data-page="brain-dump" onclick="navigate('brain-dump')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/></svg>記錄</div><div class="nav-plus" onclick="toggleComposer()"><div class="nav-plus-circle"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div><div class="nav-plus-label">寫低</div></div><div class="nav-item" data-page="sleep" onclick="navigate('sleep')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>睡眠</div><div class="nav-item" data-page="settings" onclick="navigate('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/></svg>我的</div></div>
<div class="composer-panel" id="composerPanel"><div class="composer-inner"><div class="composer-input-row"><textarea id="composerText" placeholder="寫低你嘅雜念..." rows="1" oninput="this.style.height='';this.style.height=Math.min(this.scrollHeight,48)+'px'"></textarea></div><div class="composer-actions"><div class="composer-btn" onclick="startVoice()"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/></svg>語音</div><div class="composer-btn send" onclick="submitComposer()"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/></svg>送出</div></div></div></div></div>
<script>var open=false;function navigate(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});document.getElementById(id).classList.add('active');document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active')});var nav=document.querySelector('.nav-item[data-page="'+id+'"]');if(nav)nav.classList.add('active')}function finishOnboard(){navigate('dashboard')}function toggleComposer(){open=!open;var p=document.getElementById('composerPanel');if(open){p.classList.add('show');setTimeout(function(){document.getElementById('composerText').focus()},100)}else{p.classList.remove('show')}}function submitComposer(){var t=document.getElementById('composerText');if(t&&t.value.trim()){navigate('brain-dump');var d=document.getElementById('dumpDisplay');var now=new Date();var b=document.createElement('div');b.className='dump-bubble mine';b.innerHTML='<div>'+t.value.trim()+'</div><div class="bubble-time">'+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')+'</div>';d.insertBefore(b,d.firstChild);t.value='';t.style.height=''}toggleComposer()}function nextWdStep(n){document.getElementById('wdStep'+(n-1)).style.display='none';document.getElementById('wdStep'+n).style.display='flex'}function startVoice(){alert('🎤 語音')}</script></body></html>
