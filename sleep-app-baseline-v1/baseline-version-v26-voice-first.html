<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Slumber — v26: Voice First</title><style>
:root{--bg:#141416;--bg2:#1c1c1e;--text:#e8e8ea;--text2:#909094;--text3:#58585c;--accent:#a0a0a8;--card-bg:rgba(24,24,26,.7);--card-border:rgba(160,160,168,.06);--radius:14px;--radius-sm:10px;--radius-pill:20px;--font:'Segoe UI',system-ui,sans-serif;--topbar-h:54px;--nav-h:66px;--touch-min:44px}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}svg{fill:none}html,body{height:100%;overflow:hidden;font-family:var(--font);background:#0e0e10;color:var(--text)}body{display:flex;justify-content:center;align-items:center}.phone{width:390px;height:844px;background:var(--bg);border-radius:28px;position:relative;overflow:hidden;z-index:1}.topbar{position:absolute;top:0;left:0;right:0;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:100;background:rgba(20,20,22,.8);border-bottom:1px solid var(--card-border)}.topbar .logo{font-size:18px;font-weight:700}.topbar .logo span{color:var(--accent)}.bottomnav{position:absolute;bottom:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:flex-start;justify-content:space-around;background:rgba(20,20,22,.8);z-index:100;border-top:1px solid var(--card-border);padding-top:8px}.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text3);font-size:10px;padding:4px 0 8px;min-width:60px}.nav-item::after{content:'';width:20px;height:3px;border-radius:3px;background:transparent;position:absolute;bottom:0}.nav-item.active{color:var(--accent);font-weight:600}.nav-item.active::after{background:var(--accent)}.nav-item svg{width:20px;height:20px;opacity:.5}.nav-item.active svg{opacity:1}
.fab{position:absolute;bottom:calc(var(--nav-h)+18px);right:22px;width:56px;height:56px;border-radius:50%;background:rgba(160,160,168,.18);border:1.5px solid rgba(160,160,168,.22);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:120}.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2}
.page{display:none;padding:14px 18px 20px;min-height:100%;position:relative;z-index:2}.page.active{display:block}.page#onboarding{padding-top:56px}#onboarding.active~.topbar,#onboarding.active~.bottomnav,#onboarding.active~.fab{display:none}#onboarding.active~.topbar{display:flex;background:transparent;border:none}#onboarding.active~.topbar .logo{opacity:0}
.onboard-step{display:none}.onboard-step.active{display:block}.ob-kicker{font-size:10px;text-transform:uppercase;letter-spacing:3px;color:var(--text3);margin-bottom:18px}.ob-title{font-size:26px;font-weight:700;line-height:1.3;margin-bottom:10px}.ob-line{width:36px;height:2px;background:var(--accent);margin-bottom:22px;opacity:.4}.btn-pill{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);min-height:var(--touch-min);border:1.5px solid rgba(160,160,168,.15);background:rgba(160,160,168,.08);color:var(--accent)}.btn-pill.primary{background:rgba(160,160,168,.15)}.btn-full{width:100%}

/* === v26: VOICE-FIRST Brain Dump === */
.voice-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.voice-btn{width:100px;height:100px;border-radius:50%;background:rgba(160,160,168,.12);border:2px solid rgba(160,160,168,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;margin-bottom:20px;color:var(--accent)}.voice-btn:active{background:rgba(160,160,168,.25);transform:scale(.95)}.voice-btn svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:2}.voice-hint{font-size:14px;color:var(--text2);margin-bottom:6px}.voice-sub{font-size:11px;color:var(--text3)}
.text-fallback{margin-top:24px;padding:10px 18px;border-radius:var(--radius-pill);font-size:13px;color:var(--text3);cursor:pointer;background:var(--card-bg);border:1px solid var(--card-border);display:inline-flex;align-items:center;gap:6px}
.dump-history{display:flex;flex-direction:column;gap:8px;margin-top:20px;padding:0 0 20px;overflow-y:auto;max-height:200px}.dump-bubble{max-width:85%;padding:10px 14px;border-radius:var(--radius);font-size:13px;line-height:1.4}.dump-bubble.mine{align-self:flex-end;background:rgba(160,160,168,.08);border:1px solid rgba(160,160,168,.12);color:var(--text)}.dump-bubble .bubble-time{font-size:8px;color:var(--text3);margin-top:3px;text-align:right}

.hero-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:16px;margin-bottom:10px}.hero-stat{font-size:40px;font-weight:200;letter-spacing:-1.5px}.hero-stat .unit{font-size:15px;color:var(--text2)}
.checkpoint-row{display:flex;gap:10px;margin-bottom:10px}.cp-card{flex:1;padding:16px;border-radius:var(--radius);text-align:center;cursor:pointer;font-weight:600;font-size:14px;min-height:var(--touch-min);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card-bg);border:1.5px solid var(--card-border)}.cp-card.cp-wake{border-color:rgba(160,160,168,.2);color:var(--accent)}
.sleep-pills{display:flex;gap:10px;margin-bottom:16px}.sleep-pill-btn{flex:1;padding:18px;border-radius:var(--radius-pill);text-align:center;cursor:pointer;font-weight:600;font-size:14px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card-bg);border:1.5px solid var(--card-border)}.sp-wake{border-color:rgba(160,160,168,.2);color:var(--accent)}.sp-sub{font-size:10px;opacity:.5}.tl-node{display:flex;gap:12px}.tl-dot{width:14px;height:14px;min-width:14px;border-radius:50%;border:2px solid var(--accent);margin-top:4px}.tl-dot.active{background:var(--accent)}.tl-node-content{flex:1;padding:10px 14px;border-radius:var(--radius-sm);background:var(--card-bg);border:1px solid var(--card-border);font-size:13px;margin-bottom:6px}.tl-node-content .tl-time{font-size:11px;color:var(--text3);font-weight:600}
.wd-countdown{text-align:center}.wd-circle{width:150px;height:150px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:var(--card-bg);border:1px solid var(--card-border)}.wd-circle-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.wd-circle-inner .big{font-size:52px;font-weight:200}.wd-circle-inner .small{font-size:13px;color:var(--text2);margin-top:4px}.wd-cog{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer}</style></head><body><div class="phone">
<div class="page active" id="onboarding"><div class="onboard-step active"><div class="ob-kicker">01 · Sleep Well</div><div class="ob-title">講出嚟<br>唔使打字</div><div class="ob-line"></div><div style="color:var(--text2);font-size:14px;line-height:1.5;margin-bottom:22px">深夜攰嘅時候，講出你嘅雜念，唔使打字。語音優先，文字做後備。</div><button class="btn-pill primary btn-full" onclick="finishOnboard()">開始使用</button></div></div>
<div class="page" id="dashboard"><div class="hero-card"><div class="hero-stat">7<span class="unit">h</span> 30<span class="unit">m</span></div><div style="font-size:11px;color:var(--text2)">23:30 入睡 · 07:00 起身</div></div><div class="dump-pill" style="display:flex;align-items:center;gap:10px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-pill);padding:6px 6px 6px 18px;margin-bottom:10px"><input type="text" placeholder="或者打字..."><div class="send-pill" onclick="navigate('brain-dump')" style="width:38px;height:38px;border-radius:50%;background:rgba(160,160,168,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></div></div><div class="checkpoint-row"><div class="cp-card cp-wake" onclick="navigate('sleep')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/></svg>起身</div><div class="cp-card" onclick="navigate('sleep')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>準備瞓</div></div></div>
<div class="page" id="brain-dump"><div class="voice-hero"><div class="voice-btn" onclick="startVoice()"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></div><div class="voice-hint">撳一下，開始講嘢</div><div class="voice-sub">廣東話 · 自動轉文字</div><div class="text-fallback" onclick="document.getElementById('textInput').focus()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/></svg>或者打字</div></div><textarea id="textInput" placeholder="或者喺度打字..." style="width:calc(100% - 36px);margin:0 18px;padding:12px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);color:var(--text);font-size:14px;resize:none;font-family:var(--font);min-height:60px;outline:none" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();addDump()}"></textarea><div class="dump-history" id="dumpHistory"><div class="dump-bubble mine"><div>聽日個 presentation</div><div class="bubble-time">22:45</div></div></div></div>
<div class="page" id="sleep"><div class="sleep-pills"><div class="sleep-pill-btn sp-wake" onclick="checkpoint('wake')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/></svg>起身<span class="sp-sub">記錄起床</span></div><div class="sleep-pill-btn" onclick="checkpoint('sleep')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>準備瞓<span class="sp-sub">睡前放鬆</span></div></div><div class="tl-node"><div class="tl-dot active"></div><div class="tl-node-content"><div class="tl-time">23:45</div><div>準備入睡</div></div></div><div class="tl-node" onclick="alert('手動添加記錄')"><div class="tl-dot" style="border-color:var(--text3)"></div><div class="tl-node-content" style="opacity:.35;cursor:pointer"><div class="tl-time" style="color:var(--text3)">+</div><div style="color:var(--text3)">手動添加記錄</div></div></div></div>
<div class="page" id="wind-down"><div class="wd-countdown" style="margin-bottom:22px"><div class="wd-circle"><div class="wd-circle-inner"><span class="big">10</span><span class="small">mins left</span></div></div></div><div class="wd-cog" onclick="alert('引導式認知重構練習')"><div style="font-size:28px;margin-bottom:8px">🧘</div><div style="font-size:15px;font-weight:600">認知重構引導</div><div style="font-size:12px;color:var(--text2);margin-top:4px">3 分鐘練習</div></div></div>
<div class="page" id="settings"><div style="padding:14px 18px"><div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:16px">作息設定</div></div></div>
<div class="topbar"><div class="logo">slumber<span>.</span></div></div>
<div class="bottomnav"><div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/></svg>首頁</div><div class="nav-item" data-page="brain-dump" onclick="navigate('brain-dump')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/></svg>記錄</div><div class="nav-item" data-page="sleep" onclick="navigate('sleep')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>睡眠</div><div class="nav-item" data-page="settings" onclick="navigate('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/></svg>我的</div></div>
<button class="fab" onclick="quickDump()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>
<script>function navigate(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});document.getElementById(id).classList.add('active');document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active')});var nav=document.querySelector('.nav-item[data-page="'+id+'"]');if(nav)nav.classList.add('active')}function finishOnboard(){navigate('dashboard')}function quickDump(){navigate('brain-dump')}function startVoice(){alert('🎤 開始聆聽...（語音轉文字功能）')}function addDump(){var t=document.getElementById('textInput');var h=document.getElementById('dumpHistory');if(t&&t.value.trim()&&h){var now=new Date();var b=document.createElement('div');b.className='dump-bubble mine';b.innerHTML='<div>'+t.value.trim()+'</div><div class="bubble-time">'+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')+'</div>';h.insertBefore(b,h.firstChild);t.value=''}}function checkpoint(type){alert(type==='wake'?'已記錄起床時間':'已記錄準備入睡')}</script></body></html>
