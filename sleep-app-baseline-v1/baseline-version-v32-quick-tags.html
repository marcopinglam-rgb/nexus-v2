<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Slumber — v32: Quick Tags</title><style>
:root{--bg:#110a10;--bg2:#1a1018;--text:#ece0e8;--text2:#a890a0;--text3:#685068;--accent:#b8889e;--card-bg:rgba(26,15,24,.7);--card-border:rgba(184,136,158,.08);--radius:18px;--radius-sm:12px;--radius-pill:22px;--font:'Segoe UI',system-ui,sans-serif;--topbar-h:54px;--nav-h:66px;--touch-min:44px;--composer-h:56px}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}svg{fill:none}html,body{height:100%;overflow:hidden;font-family:var(--font);background:#0a060a;color:var(--text)}body{display:flex;justify-content:center;align-items:center}body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 40% 40% at 60% 20%,rgba(160,100,130,.04),transparent 60%)}.phone{width:390px;height:844px;background:var(--bg);border-radius:28px;position:relative;overflow:hidden;z-index:1}.topbar{position:absolute;top:0;left:0;right:0;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:100;background:rgba(17,10,16,.75);border-bottom:1px solid var(--card-border)}.topbar .logo{font-size:18px;font-weight:700}.topbar .logo span{color:var(--accent)}.bottomnav{position:absolute;bottom:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:flex-start;justify-content:space-around;background:rgba(17,10,16,.75);z-index:100;border-top:1px solid var(--card-border);padding-top:8px}.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text3);font-size:10px;padding:4px 0 8px;min-width:60px;position:relative}.nav-item::after{content:'';width:24px;height:3px;border-radius:3px;background:transparent;position:absolute;bottom:0}.nav-item.active{color:var(--accent);font-weight:600}.nav-item.active::after{background:var(--accent)}.nav-item svg{width:20px;height:20px;opacity:.5}.nav-item.active svg{opacity:1}.fab{display:none}.composer-bar{position:absolute;bottom:var(--nav-h);left:0;right:0;height:var(--composer-h);display:flex;align-items:center;gap:8px;background:var(--card-bg);backdrop-filter:blur(16px);border-top:1px solid var(--card-border);padding:6px 14px;z-index:90}.composer-bar input{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;outline:none;font-family:var(--font)}.composer-bar .composer-send{width:40px;height:40px;border-radius:50%;background:rgba(184,136,158,.15);border:1px solid rgba(184,136,158,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent)}.composer-bar .composer-send svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}
.page{display:none;padding:14px 18px 20px;min-height:100%;position:relative;z-index:2}.page.active{display:block}.page-content{padding-bottom:calc(var(--composer-h)+8px)}.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.page#onboarding{padding-top:60px}#onboarding.active~.topbar,#onboarding.active~.bottomnav,#onboarding.active~.composer-bar{display:none}#onboarding.active~.topbar{display:flex;background:transparent;border:none}#onboarding.active~.topbar .logo{opacity:0}.onboard-step{display:none;animation:fadeUp .3s ease}.onboard-step.active{display:block}@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.ob-kicker{font-size:10px;text-transform:uppercase;letter-spacing:3px;color:var(--text3);margin-bottom:18px}.ob-title{font-size:26px;font-weight:700;line-height:1.3;margin-bottom:10px}.ob-line{width:36px;height:2px;background:var(--accent);margin-bottom:22px;opacity:.4}.btn-pill{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);min-height:var(--touch-min);border:1.5px solid rgba(184,136,158,.15);background:rgba(184,136,158,.08);color:var(--accent)}.btn-pill.primary{background:rgba(184,136,158,.15);border-color:rgba(184,136,158,.25)}.btn-full{width:100%;justify-content:center}

.cp-hero{display:flex;gap:12px;margin-bottom:12px}.cp-hero-btn{flex:1;padding:22px 14px;border-radius:var(--radius);text-align:center;cursor:pointer;font-weight:700;font-size:15px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card-bg);border:2px solid var(--card-border)}.cp-hero-btn.cp-wake{border-color:rgba(184,136,158,.25);color:var(--accent);background:rgba(184,136,158,.06)}.cp-hero-sub{font-size:11px;opacity:.5;margin-top:4px}.sleep-goal-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px}.sleep-goal-card .sg-num{font-size:28px;font-weight:300}.sleep-goal-card .sg-meta{font-size:11px;color:var(--text2)}

/* === v32: QUICK TAG CHIPS for Brain Dump === */
.dump-display{flex:1;overflow-y:auto;padding-bottom:8px}.dump-bubble{max-width:85%;padding:10px 14px;border-radius:var(--radius);font-size:13px;line-height:1.4;margin-bottom:8px}.dump-bubble.mine{margin-left:auto;background:rgba(184,136,158,.08);border:1px solid rgba(184,136,158,.12);border-bottom-right-radius:6px;color:var(--text)}.dump-bubble .bubble-time{font-size:8px;color:var(--text3);margin-top:3px;text-align:right}.dump-bubble .bubble-tag{display:inline-block;font-size:9px;padding:2px 8px;border-radius:8px;margin-right:4px;background:rgba(184,136,158,.1);color:var(--accent)}
.quick-tag-zone{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;border-top:1px solid var(--card-border);flex-shrink:0}.quick-tag{display:flex;align-items:center;gap:6px;padding:12px 18px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;cursor:pointer;background:var(--card-bg);border:1.5px solid var(--card-border);color:var(--text2);min-height:var(--touch-min);transition:all .2s}.quick-tag:active{background:rgba(184,136,158,.1);border-color:var(--accent);color:var(--accent)}.quick-tag .qt-emoji{font-size:18px}

.sleep-pills{display:flex;gap:10px;margin-bottom:16px}.sleep-pill-btn{flex:1;padding:16px;border-radius:var(--radius-pill);text-align:center;cursor:pointer;font-weight:600;font-size:14px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card-bg);border:1.5px solid var(--card-border)}.sp-wake{border-color:rgba(184,136,158,.2);color:var(--accent)}.sp-sub{font-size:10px;opacity:.5;margin-top:2px}.tl-node{display:flex;gap:12px}.tl-dot{width:14px;height:14px;min-width:14px;border-radius:50%;border:2px solid var(--accent);margin-top:4px}.tl-dot.active{background:var(--accent)}.tl-node-content{flex:1;padding:10px 14px;border-radius:var(--radius-sm);background:var(--card-bg);border:1px solid var(--card-border);font-size:13px;margin-bottom:6px}.tl-node-content .tl-time{font-size:11px;color:var(--text3);font-weight:600}
.wd-countdown{text-align:center}.wd-circle{width:150px;height:150px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:var(--card-bg);border:1px solid var(--card-border)}.wd-circle-inner{display:flex;flex-direction:column;align-items:center;justify-content:center}.wd-circle-inner .big{font-size:52px;font-weight:200}.wd-circle-inner .small{font-size:13px;color:var(--text2);margin-top:4px}.wd-cog{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer}</style></head><body><div class="phone">
<div class="page active" id="onboarding"><div class="onboard-step active"><div class="ob-kicker">01 · Sleep Well</div><div class="ob-title">卸下思緒重量<br>找回入眠本能</div><div class="ob-line"></div><div style="color:var(--text2);font-size:14px;line-height:1.5;margin-bottom:22px">失眠嘅根源唔係你唔夠攰，而係腦入面太多嘢放唔低。我哋幫你喺睡前清空雜念，引導你一步步進入放鬆狀態。</div><button class="btn-pill primary btn-full" onclick="finishOnboard()">開始使用</button></div></div>
<div class="page" id="dashboard"><div class="page-content"><div class="cp-hero"><div class="cp-hero-btn cp-wake" onclick="navigate('sleep')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/></svg>起身<div class="cp-hero-sub">記錄起床</div></div><div class="cp-hero-btn" onclick="navigate('sleep')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>準備瞓<div class="cp-hero-sub">睡前放鬆</div></div></div><div class="sleep-goal-card"><div class="sg-num">7h30</div><div class="sg-meta">今晚目標<br>23:30 入睡 · 07:00 起身</div></div></div></div>
<!-- v32: QUICK TAG Brain Dump -->
<div class="page" id="brain-dump"><div class="page-content" style="display:flex;flex-direction:column;height:calc(100% - 12px)"><div class="dump-display" id="dumpDisplay"><div class="dump-bubble mine"><div>今日開會好攰</div><div class="bubble-time">22:45</div></div></div><div class="quick-tag-zone"><div class="quick-tag" onclick="quickTag('工作壓力')"><span class="qt-emoji">💼</span>工作壓力</div><div class="quick-tag" onclick="quickTag('身體疲累')"><span class="qt-emoji">😴</span>身體疲累</div><div class="quick-tag" onclick="quickTag('情緒波動')"><span class="qt-emoji">😌</span>情緒波動</div><div class="quick-tag" onclick="quickTag('靈感浮現')"><span class="qt-emoji">💡</span>靈感浮現</div><div class="quick-tag" onclick="quickTag('人際關係')"><span class="qt-emoji">💬</span>人際關係</div><div class="quick-tag" onclick="startVoice()" style="border-style:dashed"><span class="qt-emoji">🎤</span>語音輸入</div></div></div></div>
<div class="page" id="sleep"><div class="page-content"><div class="sleep-pills"><div class="sleep-pill-btn sp-wake" onclick="checkpoint('wake')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/></svg>起身<span class="sp-sub">記錄起床</span></div><div class="sleep-pill-btn" onclick="checkpoint('sleep')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>準備瞓<span class="sp-sub">睡前放鬆</span></div></div><div class="tl-node"><div class="tl-dot active"></div><div class="tl-node-content"><div class="tl-time">23:45</div><div>準備入睡</div></div></div><div class="tl-node" onclick="alert('手動添加記錄')"><div class="tl-dot" style="border-color:var(--text3)"></div><div class="tl-node-content" style="opacity:.35;cursor:pointer"><div class="tl-time" style="color:var(--text3)">+</div><div style="color:var(--text3)">手動添加記錄</div></div></div></div></div>
<div class="page" id="wind-down"><div class="page-content"><div class="wd-countdown" style="margin-bottom:22px"><div class="wd-circle"><div class="wd-circle-inner"><span class="big">10</span><span class="small">mins left</span></div></div></div><div class="wd-cog" onclick="alert('引導式認知重構練習')"><div style="font-size:28px;margin-bottom:8px">🧘</div><div style="font-size:15px;font-weight:600">認知重構引導</div><div style="font-size:12px;color:var(--text2);margin-top:4px">3 分鐘練習</div></div></div></div>
<div class="topbar"><div class="logo">slumber<span>.</span></div></div>
<div class="bottomnav"><div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/></svg>首頁</div><div class="nav-item" data-page="brain-dump" onclick="navigate('brain-dump')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/></svg>記錄</div><div class="nav-item" data-page="sleep" onclick="navigate('sleep')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>睡眠</div><div class="nav-item" data-page="settings" onclick="navigate('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/></svg>我的</div></div>
<div class="composer-bar"><input type="text" id="composerInput" placeholder="或者自己打字..."><div class="composer-send" onclick="quickDump()"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/></svg></div></div></div>
<script>function navigate(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});document.getElementById(id).classList.add('active');document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active')});var nav=document.querySelector('.nav-item[data-page="'+id+'"]');if(nav)nav.classList.add('active')}function finishOnboard(){navigate('dashboard')}function quickTag(label){var d=document.getElementById('dumpDisplay');var now=new Date();var time=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');var b=document.createElement('div');b.className='dump-bubble mine';b.innerHTML='<div><span class="bubble-tag">'+label+'</span></div><div class="bubble-time">'+time+'</div>';d.insertBefore(b,d.firstChild)}function quickDump(){var t=document.getElementById('composerInput');if(t&&t.value.trim()){navigate('brain-dump');var d=document.getElementById('dumpDisplay');var now=new Date();var time=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');var b=document.createElement('div');b.className='dump-bubble mine';b.innerHTML='<div>'+t.value.trim()+'</div><div class="bubble-time">'+time+'</div>';d.insertBefore(b,d.firstChild);t.value=''}}function startVoice(){alert('🎤 語音輸入')}function checkpoint(type){alert(type==='wake'?'已記錄起床時間':'已記錄準備入睡')}</script></body></html>
