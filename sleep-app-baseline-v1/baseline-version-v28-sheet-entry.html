<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>Slumber — v28: Sheet Entry</title><style>
:root{--bg:#110a10;--bg2:#1a1018;--text:#ece0e8;--text2:#a890a0;--text3:#685068;--accent:#b8889e;--card-bg:rgba(26,15,24,.7);--card-border:rgba(184,136,158,.08);--radius:18px;--radius-sm:12px;--radius-pill:22px;--font:'Segoe UI',system-ui,sans-serif;--topbar-h:54px;--nav-h:66px;--touch-min:44px}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}svg{fill:none}html,body{height:100%;overflow:hidden;font-family:var(--font);background:#0a060a;color:var(--text)}body{display:flex;justify-content:center;align-items:center}.phone{width:390px;height:844px;background:var(--bg);border-radius:28px;position:relative;overflow:hidden;z-index:1}.topbar{position:absolute;top:0;left:0;right:0;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:100;background:rgba(17,10,16,.75);border-bottom:1px solid var(--card-border)}.topbar .logo{font-size:18px;font-weight:700}.topbar .logo span{color:var(--accent)}.bottomnav{position:absolute;bottom:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:flex-start;justify-content:space-around;background:rgba(17,10,16,.75);z-index:100;border-top:1px solid var(--card-border);padding-top:8px}.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text3);font-size:10px;padding:4px 0 8px;min-width:60px;position:relative}.nav-item::after{content:'';width:24px;height:3px;border-radius:3px;background:transparent;position:absolute;bottom:0}.nav-item.active{color:var(--accent);font-weight:600}.nav-item.active::after{background:var(--accent)}.nav-item svg{width:20px;height:20px;opacity:.5}.nav-item.active svg{opacity:1}.fab{position:absolute;bottom:calc(var(--nav-h)+18px);right:22px;width:56px;height:56px;border-radius:50%;background:rgba(184,136,158,.18);border:1.5px solid rgba(184,136,158,.22);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:120}.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2}.page{display:none;padding:14px 18px 20px;min-height:100%;position:relative;z-index:2}.page.active{display:block}.page#onboarding{padding-top:60px}#onboarding.active~.topbar,#onboarding.active~.bottomnav,#onboarding.active~.fab{display:none}#onboarding.active~.topbar{display:flex;background:transparent;border:none}#onboarding.active~.topbar .logo{opacity:0}
.hero-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:16px;margin-bottom:10px}.hero-stat{font-size:40px;font-weight:200}.hero-stat .unit{font-size:15px;color:var(--text2)}.dump-pill{display:flex;align-items:center;gap:10px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-pill);padding:6px 6px 6px 18px;margin-bottom:10px}.dump-pill input{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;outline:none;font-family:var(--font)}.dump-pill .send-pill{width:38px;height:38px;border-radius:50%;background:rgba(184,136,158,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent)}.dump-pill .send-pill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}

/* === v28: BOTTOM SHEET Sleep entry === */
.sleep-timeline{display:flex;flex-direction:column;gap:0;position:relative;padding-left:28px}.sleep-timeline::before{content:'';position:absolute;left:12px;top:8px;bottom:8px;width:2px;background:rgba(184,136,158,.12)}.st-node{display:flex;align-items:center;gap:12px;padding:10px 0;position:relative}.st-node::before{content:'';position:absolute;left:-20px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);background:var(--bg)}.st-node .st-time{font-size:15px;font-weight:600;min-width:50px}.st-node .st-action{font-size:13px;color:var(--text2)}
.sheet-trigger{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;margin:16px 0 16px 28px;border-radius:var(--radius-pill);background:rgba(184,136,158,.1);border:1.5px solid rgba(184,136,158,.18);color:var(--accent);font-size:14px;font-weight:600;cursor:pointer}
/* Bottom sheet overlay */
.sheet-overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:200;justify-content:flex-end;align-items:flex-end}.sheet-overlay.show{display:flex}.sheet-panel{width:100%;background:var(--bg2);border-radius:20px 20px 0 0;padding:24px 20px 40px;border-top:1px solid var(--card-border);animation:slideUp .3s ease}@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}.sheet-panel h3{font-size:16px;font-weight:600;margin-bottom:16px;text-align:center}.sheet-actions{display:flex;gap:12px;margin-bottom:12px}.sheet-btn{flex:1;padding:18px;border-radius:var(--radius);text-align:center;cursor:pointer;font-weight:600;font-size:15px;background:var(--card-bg);border:1.5px solid var(--card-border)}.sheet-btn.wake{border-color:rgba(184,136,158,.2);color:var(--accent)}.sheet-close{text-align:center;padding:12px;color:var(--text3);cursor:pointer;font-size:14px;margin-top:8px}

.dump-chat-area{display:flex;flex-direction:column;gap:10px;overflow-y:auto}.dump-bubble{max-width:85%;padding:10px 14px;border-radius:var(--radius);font-size:13px}.dump-bubble.mine{align-self:flex-end;background:rgba(184,136,158,.08);border:1px solid rgba(184,136,158,.12);color:var(--text)}.dump-bubble .bubble-time{font-size:8px;color:var(--text3);margin-top:3px;text-align:right}
.wd-countdown{text-align:center}.wd-circle{width:150px;height:150px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:var(--card-bg);border:1px solid var(--card-border)}.wd-circle-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.wd-circle-inner .big{font-size:52px;font-weight:200}.wd-cog{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer}</style></head><body><div class="phone">
<div class="page active" id="onboarding"><div class="onboard-step active" style="display:block"><div style="font-size:10px;text-transform:uppercase;letter-spacing:3px;color:var(--text3);margin-bottom:18px">01 · Sleep Well</div><div style="font-size:26px;font-weight:700;line-height:1.3;margin-bottom:10px">由底部滑出<br>唔使跳頁</div><div style="width:36px;height:2px;background:var(--accent);margin-bottom:22px;opacity:.4"></div><div style="color:var(--text2);font-size:14px;line-height:1.5;margin-bottom:22px">記錄睡眠用底部 Sheet，唔使跳去新頁面。留喺目前畫面，快速完成。</div><div style="display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:22px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;border:1.5px solid rgba(184,136,158,.15);background:rgba(184,136,158,.15);color:var(--accent);width:100%;font-family:var(--font)" onclick="finishOnboard()">開始使用</div></div></div>
<div class="page" id="dashboard"><div class="hero-card"><div class="hero-stat">7<span class="unit">h</span> 30<span class="unit">m</span></div><div style="font-size:11px;color:var(--text2)">23:30 入睡 · 07:00 起身</div></div><div class="dump-pill"><input type="text" placeholder="將腦裡面嘅嘢寫低..."><div class="send-pill" onclick="navigate('brain-dump')"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></div></div></div>
<div class="page" id="brain-dump"><div class="dump-chat-area" id="dumpChat"></div></div>
<!-- v28: SLEEP WITH SHEET TRIGGER -->
<div class="page" id="sleep"><div class="sleep-timeline"><div class="st-node"><div class="st-time">07:15</div><div class="st-action">起身 ☀️</div></div><div class="st-node"><div class="st-time">23:45</div><div class="st-action">準備入睡 🌙</div></div><div class="sheet-trigger" onclick="openSheet()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>記錄睡眠事件</div><div style="padding:0 28px;font-size:11px;color:var(--text3);cursor:pointer" onclick="alert('手動添加記錄')">+ 手動添加記錄</div></div></div>
<div class="page" id="wind-down"><div class="wd-countdown" style="margin-bottom:22px"><div class="wd-circle"><div class="wd-circle-inner"><span class="big">10</span><span class="small">mins left</span></div></div></div><div class="wd-cog" onclick="alert('認知重構練習')"><div style="font-size:28px">🧘</div><div style="font-size:15px;font-weight:600">認知重構引導</div></div></div>
<!-- BOTTOM SHEET -->
<div class="sheet-overlay" id="sleepSheet" onclick="if(event.target===this)closeSheet()"><div class="sheet-panel"><h3>記錄睡眠</h3><div class="sheet-actions"><div class="sheet-btn wake" onclick="recordSleep('wake')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/></svg><div style="margin-top:4px">☀️ 起身</div></div><div class="sheet-btn" onclick="recordSleep('sleep')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg><div style="margin-top:4px">🌙 準備瞓</div></div></div><div class="sheet-close" onclick="closeSheet()">取消</div></div></div>
<div class="topbar"><div class="logo">slumber<span>.</span></div></div>
<div class="bottomnav"><div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/></svg>首頁</div><div class="nav-item" data-page="brain-dump" onclick="navigate('brain-dump')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/></svg>記錄</div><div class="nav-item" data-page="sleep" onclick="navigate('sleep')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>睡眠</div><div class="nav-item" data-page="settings" onclick="navigate('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/></svg>我的</div></div>
<button class="fab" onclick="quickDump()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>
<script>function navigate(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});document.getElementById(id).classList.add('active');document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active')});var nav=document.querySelector('.nav-item[data-page="'+id+'"]');if(nav)nav.classList.add('active')}function finishOnboard(){navigate('dashboard')}function quickDump(){navigate('brain-dump')}function openSheet(){document.getElementById('sleepSheet').classList.add('show')}function closeSheet(){document.getElementById('sleepSheet').classList.remove('show')}function recordSleep(type){closeSheet();alert(type==='wake'?'已記錄起床時間':'已記錄準備入睡')}</script></body></html>
