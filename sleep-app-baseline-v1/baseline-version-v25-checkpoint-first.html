<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Slumber — v25: Checkpoint First</title><style>
:root{--bg:#121418;--bg2:#1a1c20;--text:#e4e6e8;--text2:#888c94;--text3:#545860;--accent:#8899aa;--accent-glow:rgba(136,153,170,.12);--card-bg:rgba(20,22,26,.7);--card-border:rgba(136,153,170,.06);--radius:18px;--radius-sm:12px;--radius-pill:22px;--font:'Segoe UI',system-ui,sans-serif;--topbar-h:54px;--nav-h:66px;--touch-min:44px;--input-h:62px}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}svg{fill:none}html,body{height:100%;overflow:hidden;font-family:var(--font);background:#0c0e12;color:var(--text)}body{display:flex;justify-content:center;align-items:center}.phone{width:390px;height:844px;background:var(--bg);border-radius:28px;position:relative;overflow:hidden;z-index:1}.topbar{position:absolute;top:0;left:0;right:0;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:100;background:rgba(18,20,24,.75);border-bottom:1px solid var(--card-border)}.topbar .logo{font-size:18px;font-weight:700}.topbar .logo span{color:var(--accent)}.bottomnav{position:absolute;bottom:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:flex-start;justify-content:space-around;background:rgba(18,20,24,.75);z-index:100;border-top:1px solid var(--card-border);padding-top:8px}.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text3);font-size:10px;padding:4px 0 8px;min-width:60px;position:relative}.nav-item::after{content:'';width:24px;height:3px;border-radius:3px;background:transparent;position:absolute;bottom:0}.nav-item.active{color:var(--accent);font-weight:600}.nav-item.active::after{background:var(--accent)}.nav-item svg{width:20px;height:20px;opacity:.5}.nav-item.active svg{opacity:1}.fab{position:absolute;bottom:calc(var(--nav-h)+18px);right:22px;width:56px;height:56px;border-radius:50%;background:rgba(136,153,170,.18);border:1.5px solid rgba(136,153,170,.22);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:120}.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2}.page{display:none;padding:14px 18px 20px;min-height:100%;position:relative;z-index:2}.page.active{display:block}.page#onboarding{padding-top:60px}#onboarding.active~.topbar,#onboarding.active~.bottomnav,#onboarding.active~.fab{display:none}#onboarding.active~.topbar{display:flex;background:transparent;border:none}.ob-title{font-size:26px;font-weight:700;line-height:1.3;margin-bottom:10px}.ob-line{width:36px;height:2px;background:var(--accent);margin-bottom:22px;opacity:.4}.btn-pill{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);min-height:var(--touch-min);border:1.5px solid rgba(136,153,170,.15);background:rgba(136,153,170,.08);color:var(--accent)}.btn-pill.primary{background:rgba(136,153,170,.15)}.btn-full{width:100%}

/* === v25: CHECKPOINT FIRST (hierarchy change) === */
.cp-hero{display:flex;gap:12px;margin-bottom:14px}
.cp-hero-btn{flex:1;padding:24px 16px;border-radius:var(--radius);text-align:center;cursor:pointer;font-weight:700;font-size:16px;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card-bg);border:2px solid var(--card-border)}.cp-hero-btn.cp-wake{border-color:rgba(136,153,170,.25);color:var(--accent);background:rgba(136,153,170,.06)}.cp-hero-sub{font-size:11px;opacity:.5;font-weight:400;margin-top:4px}
.sleep-goal-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px}.sleep-goal-card .sg-num{font-size:28px;font-weight:300;min-width:60px}.sleep-goal-card .sg-meta{font-size:11px;color:var(--text2)}
.dump-pill{display:flex;align-items:center;gap:10px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-pill);padding:6px 6px 6px 18px;margin-bottom:10px}.dump-pill input{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;outline:none;font-family:var(--font)}.dump-pill .send-pill{width:38px;height:38px;border-radius:50%;background:rgba(136,153,170,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent);flex-shrink:0}.dump-pill .send-pill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}

.dump-chat-area{display:flex;flex-direction:column;gap:10px;max-height:100%;overflow-y:auto;padding:0 0 calc(var(--input-h)+12px) 0}.dump-bubble{max-width:85%;padding:12px 16px;border-radius:var(--radius);font-size:14px}.dump-bubble.mine{align-self:flex-end;background:rgba(136,153,170,.08);border:1px solid rgba(136,153,170,.12);border-bottom-right-radius:6px;color:var(--text)}.dump-bubble .bubble-time{font-size:9px;color:var(--text3);margin-top:4px;text-align:right}.dump-input-bar{position:absolute;bottom:0;left:0;right:0;height:var(--input-h);display:flex;gap:8px;align-items:center;background:var(--card-bg);backdrop-filter:blur(16px);border-top:1px solid var(--card-border);padding:8px 16px;z-index:50}.dump-input-bar textarea{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;outline:none;font-family:var(--font);resize:none;padding:6px 0;line-height:1.5;min-height:20px;max-height:44px}.dump-input-bar .send-round{width:40px;height:40px;border-radius:50%;background:rgba(136,153,170,.14);border:1px solid rgba(136,153,170,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent)}.dump-input-bar .send-round svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}

.sleep-pills{display:flex;gap:10px;margin-bottom:18px}.sleep-pill-btn{flex:1;padding:18px;border-radius:var(--radius-pill);text-align:center;cursor:pointer;font-weight:600;font-size:14px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card-bg);border:1.5px solid var(--card-border)}.sp-wake{border-color:rgba(136,153,170,.2);color:var(--accent)}.sp-sub{font-size:10px;opacity:.5}.tl-node{display:flex;gap:12px;margin-bottom:3px}.tl-dot{width:14px;height:14px;min-width:14px;border-radius:50%;background:var(--card-bg);border:2px solid var(--accent);margin-top:4px}.tl-dot.active{background:var(--accent)}.tl-node-content{flex:1;padding:10px 14px;border-radius:var(--radius-sm);background:var(--card-bg);border:1px solid var(--card-border);font-size:13px;margin-bottom:6px}.tl-node-content .tl-time{font-size:11px;color:var(--text3);font-weight:600}
.wd-countdown{text-align:center}.wd-circle{width:150px;height:150px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:var(--card-bg);border:1px solid var(--card-border)}.wd-circle-inner .big{font-size:52px;font-weight:200}.wd-circle-inner .small{font-size:13px;color:var(--text2);margin-top:4px}.wd-cog{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer}.wd-cog:hover{border-color:var(--accent)}.wd-cog .cog-icon{font-size:28px;margin-bottom:8px}</style></head><body><div class="phone">
<div class="page active" id="onboarding"><div class="onboard-step active" style="display:block"><div style="font-size:10px;text-transform:uppercase;letter-spacing:3px;color:var(--text3);margin-bottom:18px">01 · Sleep Well</div><div class="ob-title">起身 / 準備瞓<br>最重要放最前</div><div class="ob-line"></div><div style="color:var(--text2);font-size:14px;line-height:1.5;margin-bottom:22px">Dashboard 將 Checkpoint 掣放喺最頂。深夜開 App，第一眼就係你最需要嘅動作。</div><button class="btn-pill primary btn-full" onclick="finishOnboard()">開始使用</button></div></div>
<div class="page" id="dashboard"><div class="cp-hero"><div class="cp-hero-btn cp-wake" onclick="navigate('sleep')"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2"/></svg>起身<div class="cp-hero-sub">記錄起床</div></div><div class="cp-hero-btn" onclick="navigate('sleep')"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>準備瞓<div class="cp-hero-sub">睡前放鬆</div></div></div><div class="sleep-goal-card"><div class="sg-num">7h30</div><div class="sg-meta">今晚目標<br>23:30 入睡 · 07:00 起身</div></div><div class="dump-pill"><input type="text" placeholder="將腦裡面嘅嘢寫低..."><div class="send-pill" onclick="navigate('brain-dump')"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7"/></svg></div></div></div>
<div class="page" id="brain-dump"><div class="dump-chat-area" id="dumpChat"></div><div class="dump-input-bar"><textarea id="dumpText" placeholder="寫低你嘅雜念..." rows="1" oninput="this.style.height='';this.style.height=Math.min(this.scrollHeight,44)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();addDump()}"></textarea><div class="send-round" onclick="addDump()"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/></svg></div></div></div>
<div class="page" id="sleep"><div class="sleep-pills"><div class="sleep-pill-btn sp-wake" onclick="checkpoint('wake')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/></svg>起身<span class="sp-sub">記錄起床</span></div><div class="sleep-pill-btn" onclick="checkpoint('sleep')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>準備瞓<span class="sp-sub">睡前放鬆</span></div></div><div class="tl-node"><div class="tl-dot active"></div><div class="tl-node-content"><div class="tl-time">23:45</div><div>準備入睡</div></div></div><div class="tl-node" onclick="alert('手動添加記錄')"><div class="tl-dot" style="border-color:var(--text3)"></div><div class="tl-node-content" style="opacity:.35;cursor:pointer"><div class="tl-time" style="color:var(--text3)">+</div><div style="color:var(--text3)">手動添加記錄</div></div></div></div>
<div class="page" id="wind-down"><div class="wd-countdown" style="margin-bottom:22px"><div class="wd-circle"><div class="wd-circle-inner" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><span class="big">10</span><span class="small">mins left</span></div></div></div><div class="wd-cog" onclick="alert('引導式認知重構練習')"><div class="cog-icon">🧘</div><div style="font-size:15px;font-weight:600">認知重構引導</div><div style="font-size:12px;color:var(--text2);margin-top:4px">3 分鐘練習</div></div></div>
<div class="page" id="settings"><div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:16px">作息設定</div></div>
<div class="topbar"><div class="logo">slumber<span>.</span></div></div>
<div class="bottomnav"><div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>首頁</div><div class="nav-item" data-page="brain-dump" onclick="navigate('brain-dump')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/></svg>記錄</div><div class="nav-item" data-page="sleep" onclick="navigate('sleep')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>睡眠</div><div class="nav-item" data-page="settings" onclick="navigate('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/></svg>我的</div></div>
<button class="fab" onclick="quickDump()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>
<script>function navigate(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});document.getElementById(id).classList.add('active');document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active')});var nav=document.querySelector('.nav-item[data-page="'+id+'"]');if(nav)nav.classList.add('active')}function finishOnboard(){navigate('dashboard')}function quickDump(){navigate('brain-dump');setTimeout(function(){var t=document.getElementById('dumpText');if(t)t.focus()},200)}function addDump(){var t=document.getElementById('dumpText');var chat=document.getElementById('dumpChat');if(t&&t.value.trim()&&chat){var now=new Date();var b=document.createElement('div');b.className='dump-bubble mine';b.innerHTML='<div>'+t.value.trim()+'</div><div class="bubble-time">'+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')+'</div>';chat.appendChild(b);chat.scrollTop=chat.scrollHeight;t.value='';t.style.height=''}}function checkpoint(type){alert(type==='wake'?'已記錄起床時間':'已記錄準備入睡')}</script></body></html>
