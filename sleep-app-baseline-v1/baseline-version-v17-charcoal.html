<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Slumber — v17: Charcoal</title><style>
:root{--bg:#141416;--bg2:#1c1c1e;--text:#e8e8ea;--text2:#909094;--text3:#58585c;--accent:#a0a0a8;--accent2:#808088;--accent-glow:rgba(160,160,168,.1);--card-bg:rgba(24,24,26,.8);--card-border:rgba(160,160,168,.06);--radius:6px;--radius-sm:4px;--radius-pill:6px;--font:'Segoe UI',system-ui,sans-serif;--topbar-h:54px;--nav-h:66px;--touch-min:44px}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}svg{fill:none}html,body{height:100%;overflow:hidden;font-family:var(--font);background:#0e0e10;color:var(--text)}body{display:flex;justify-content:center;align-items:center}.phone{width:390px;height:844px;background:var(--bg);border-radius:28px;position:relative;overflow:hidden;z-index:1;box-shadow:0 0 0 1px rgba(160,160,168,.04),0 20px 60px rgba(0,0,0,.55)}.topbar{position:absolute;top:0;left:0;right:0;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:100;background:rgba(20,20,22,.85);border-bottom:1px solid var(--card-border)}.topbar .logo{font-size:18px;font-weight:700}.topbar .logo span{color:var(--accent)}.topbar .icon-btn{width:var(--touch-min);height:var(--touch-min);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2)}.topbar .icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}.bottomnav{position:absolute;bottom:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:flex-start;justify-content:space-around;background:rgba(20,20,22,.85);z-index:100;border-top:1px solid var(--card-border);padding-top:10px}.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text3);transition:all .2s;font-size:10px;padding:0;min-width:60px;position:relative}.nav-item.active{color:var(--accent);font-weight:600}.nav-item svg{width:20px;height:20px;opacity:.5;transition:all .2s}.nav-item.active svg{opacity:1;stroke-width:2.5}

/* BRUTALIST FAB — square */
.fab{position:absolute;bottom:calc(var(--nav-h)+16px);right:20px;width:50px;height:50px;border-radius:var(--radius);background:var(--accent);color:#141416;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:120;transition:all .15s;box-shadow:4px 4px 0 rgba(0,0,0,.3)}.fab:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.3)}.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.5}.fab-label{position:absolute;right:58px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--accent);opacity:.8}.page{display:none;padding:14px 18px 20px;min-height:100%;position:relative;z-index:2}.page.active{display:block}.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}.btn-brut{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;font-family:var(--font);min-height:var(--touch-min);border:2px solid var(--accent);background:var(--accent);color:#141416}.btn-brut:active{background:var(--text);border-color:var(--text)}.btn-brut.ghost{background:transparent;border-color:rgba(255,255,255,.08);color:var(--text2)}.btn-full{width:100%;justify-content:center;margin-bottom:6px}.page#onboarding{padding-top:56px}#onboarding.active~.topbar,#onboarding.active~.bottomnav,#onboarding.active~.fab{display:none}#onboarding.active~.topbar{display:flex;background:transparent;border:none}#onboarding.active~.topbar .logo,#onboarding.active~.topbar .icon-btn{opacity:0}.onboard-step{display:none}.onboard-step.active{display:block}.ob-kicker{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--text3);margin-bottom:16px}.ob-title{font-size:24px;font-weight:700;line-height:1.3;margin-bottom:10px}.ob-sub{color:var(--text2);font-size:14px;line-height:1.5;margin-bottom:20px}.ob-line{width:32px;height:2px;background:var(--accent);margin-bottom:20px}.ob-dots{display:flex;gap:6px;justify-content:center;margin-top:24px}.ob-dot{width:6px;height:6px;border-radius:2px;background:rgba(255,255,255,.06)}.ob-dot.active{background:var(--accent);width:18px}.sleep-target{display:flex;gap:10px;justify-content:center;margin:16px 0 20px}.st-option{width:52px;height:52px;border-radius:var(--radius);background:var(--card-bg);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--text2);cursor:pointer}.st-option.active{border-color:var(--accent);color:var(--accent)}.schedule-type{display:flex;flex-direction:column;gap:6px;margin:12px 0 20px}.st-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius);background:var(--card-bg);border:1px solid var(--card-border);cursor:pointer}.st-row.active{border-color:var(--accent)}.hero-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:16px;margin-bottom:10px}.hero-stat{font-size:40px;font-weight:200;letter-spacing:-1.5px}.hero-stat .unit{font-size:15px;color:var(--text2)}.stat-row{display:flex;gap:10px;margin-top:8px}.stat-box{flex:1;text-align:center;padding:10px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius)}.stat-box .num{font-size:20px;font-weight:500}.stat-box .lbl{font-size:8px;text-transform:uppercase;color:var(--text3);margin-top:2px}.dump-pill{display:flex;align-items:center;gap:8px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:6px 10px;margin-bottom:10px}.dump-pill input{flex:1;background:transparent;border:none;color:var(--text);font-size:13px;outline:none;font-family:var(--font)}.dump-pill input::placeholder{color:var(--text3)}.dump-pill .send-pill{width:34px;height:34px;border-radius:var(--radius);background:var(--accent);color:#141416;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}.dump-pill .send-pill svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3}.checkpoint-row{display:flex;gap:10px;margin-bottom:10px}.cp-card{flex:1;padding:14px 10px;border-radius:var(--radius);text-align:center;cursor:pointer;font-weight:600;font-size:13px;min-height:var(--touch-min);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card-bg);border:1px solid var(--card-border)}.cp-card.cp-wake{background:var(--accent);color:#141416;border:none}.cp-card.cp-sleep{color:var(--text2)}.cp-sub{font-size:9px;opacity:.5;margin-top:2px}.trend-row{display:flex;align-items:flex-end;gap:4px;height:32px}.trend-row .tb{flex:1;background:rgba(160,160,168,.08);border-radius:2px}.trend-row .tb.today{background:var(--accent)}.dump-chat-area{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:280px;overflow-y:auto}.dump-bubble{max-width:85%;padding:10px 14px;border-radius:var(--radius);font-size:13px;line-height:1.4}.dump-bubble.mine{align-self:flex-end;background:var(--accent);color:#141416}.dump-bubble.ai{align-self:flex-start;background:var(--card-bg);border:1px solid var(--card-border);color:var(--text2)}.dump-bubble .bubble-time{font-size:8px;opacity:.5;margin-top:3px}.dump-input-bar{display:flex;gap:6px;align-items:center;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:4px 4px 4px 12px}.dump-input-bar textarea{flex:1;background:transparent;border:none;color:var(--text);font-size:13px;outline:none;font-family:var(--font);resize:none;padding:6px 0;line-height:1.4;min-height:20px;max-height:50px}.dump-input-bar .send-round{width:36px;height:36px;border-radius:var(--radius);background:var(--accent);color:#141416;display:flex;align-items:center;justify-content:center;cursor:pointer}.dump-mode-row{display:flex;gap:6px;margin-bottom:10px}.dump-mode-chip{padding:7px 14px;border-radius:var(--radius);font-size:12px;cursor:pointer;color:var(--text2);background:var(--card-bg);border:1px solid var(--card-border);min-height:34px;display:flex;align-items:center;gap:3px}.dump-mode-chip.active{border-color:var(--accent);color:var(--accent)}.tag-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.tag-chip{font-size:11px;padding:5px 12px;border-radius:var(--radius);color:var(--text2);cursor:pointer;background:var(--card-bg);border:1px solid var(--card-border);min-height:30px;display:flex;align-items:center}.tag-chip.active{border-color:var(--accent);color:var(--accent)}.sleep-pills{display:flex;gap:10px;margin-bottom:16px}.sleep-pill-btn{flex:1;padding:16px 10px;border-radius:var(--radius);text-align:center;cursor:pointer;font-weight:600;font-size:13px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card-bg);border:1px solid var(--card-border)}.sp-wake{background:var(--accent);color:#141416;border:none}.sp-bed{color:var(--text2)}.sp-sub{font-size:9px;opacity:.5;margin-top:2px}.wd-countdown{text-align:center;margin-bottom:20px}.wd-circle{width:140px;height:140px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:var(--card-bg);border:1px solid var(--card-border)}.wd-circle-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1}.wd-circle-inner .big{font-size:48px;font-weight:200}.wd-circle-inner .small{font-size:12px;color:var(--text2);margin-top:4px}.wd-bar-row{display:flex;gap:4px;max-width:200px;margin:0 auto}.wd-bar{height:4px;flex:1;border-radius:2px;background:rgba(255,255,255,.03)}.wd-bar.done{background:rgba(160,160,168,.3)}.wd-bar.active{background:var(--accent)}.settings-section{margin-bottom:22px}.settings-section h3{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--text3);margin-bottom:5px}.setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--card-border);min-height:var(--touch-min)}.setting-row .sr-label{font-size:13px}.setting-row .sr-toggle{width:42px;height:26px;border-radius:4px;background:rgba(255,255,255,.04);position:relative;cursor:pointer}.setting-row .sr-toggle.on{background:var(--accent)}.setting-row .sr-toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:2px;background:white;transition:transform .2s}.setting-row .sr-toggle.on::after{transform:translateX(16px)}.lang-chips{display:flex;gap:6px}.lang-chip{padding:9px 16px;border-radius:var(--radius);font-size:12px;cursor:pointer;color:var(--text2);background:var(--card-bg);border:1px solid var(--card-border);min-height:var(--touch-min);display:flex;align-items:center}.lang-chip.active{border-color:var(--accent);color:var(--accent)}</style></head><body><div class="phone">
<div class="page active" id="onboarding"><div class="onboard-step active" data-step="1"><div class="ob-kicker">01 · SLEEP WELL</div><div class="ob-title">功能至上。<br>回歸睡眠本質。</div><div class="ob-line"></div><div class="ob-sub">冇多餘裝飾。寫低雜念、追蹤作息、睡前放鬆。就係咁簡單。</div><button class="btn-brut btn-full" onclick="onboardNext()">開始</button><div class="ob-dots"><div class="ob-dot active"></div><div class="ob-dot"></div><div class="ob-dot"></div></div></div><div class="onboard-step" data-step="2"><div class="ob-kicker">02 · GOAL</div><div class="ob-title">目標睡眠時長</div><div class="sleep-target" id="sTs"><div class="st-option" data-h="6" onclick="selectSleep(this)">6</div><div class="st-option active" data-h="7" onclick="selectSleep(this)">7</div><div class="st-option" data-h="8" onclick="selectSleep(this)">8</div><div class="st-option" data-h="9" onclick="selectSleep(this)">9</div></div><button class="btn-brut btn-full" onclick="onboardNext()">繼續</button><div class="ob-dots"><div class="ob-dot done"></div><div class="ob-dot active"></div><div class="ob-dot"></div></div></div><div class="onboard-step" data-step="3"><div class="ob-kicker">03 · READY</div><div class="ob-title">準備好未？</div><button class="btn-brut btn-full" onclick="finishOnboard()">開始使用</button></div></div>
<div class="page" id="dashboard"><div class="hero-card"><div style="font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:6px">今晚目標</div><div class="hero-stat">7<span class="unit">h</span> 30<span class="unit">m</span></div><div style="font-size:11px;color:var(--text2);margin-top:2px">23:30 入睡 · 07:00 起身</div><div class="stat-row"><div class="stat-box"><div class="num">78</div><div class="lbl">質素</div></div><div class="stat-box"><div class="num">5</div><div class="lbl">達標日</div></div><div class="stat-box"><div class="num">−25m</div><div class="lbl">提早</div></div></div></div><div class="dump-pill"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text3)"><path d="M12 20h9"/></svg><input type="text" placeholder="寫低雜念..."><div class="send-pill" onclick="navigate('brain-dump')"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7"/></svg></div></div><div class="checkpoint-row"><div class="cp-card cp-wake" onclick="navigate('sleep')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5"/></svg>起身</div><div class="cp-card cp-sleep" onclick="navigate('sleep')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>準備瞓</div></div></div>
<div class="page" id="brain-dump"><div class="dump-mode-row"><div class="dump-mode-chip active"><svg viewBox="0 0 24 24"><path d="M12 20h9"/></svg>文字</div><div class="dump-mode-chip"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8"/></svg>語音</div></div><div class="dump-chat-area" id="dumpChat"></div><div class="dump-input-bar"><textarea id="dumpText" placeholder="寫低你嘅雜念..." rows="1" oninput="this.style.height='';this.style.height=Math.min(this.scrollHeight,50)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();addDump()}"></textarea><div class="send-round" onclick="addDump()"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/></svg></div></div><div class="dump-to-wd" style="text-align:center;padding:12px;color:var(--accent);cursor:pointer;border-radius:var(--radius);background:var(--card-bg);border:1px solid var(--card-border);margin-top:10px" onclick="navigate('wind-down')">前往睡前放鬆 →</div></div>
<div class="page" id="sleep"><div class="sleep-pills"><div class="sleep-pill-btn sp-wake" onclick="checkpoint('wake')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5"/></svg>起身</div><div class="sleep-pill-btn sp-bed" onclick="checkpoint('sleep')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>準備瞓</div></div></div>
<div class="page" id="wind-down"><div class="wd-countdown"><div class="wd-circle"><div class="wd-circle-inner"><span class="big">10</span><span class="small">mins left</span></div></div><div class="wd-bar-row"><div class="wd-bar done"></div><div class="wd-bar done"></div><div class="wd-bar done"></div><div class="wd-bar done"></div><div class="wd-bar done"></div><div class="wd-bar active"></div><div class="wd-bar"></div><div class="wd-bar"></div><div class="wd-bar"></div><div class="wd-bar"></div></div></div><div class="wd-cog" onclick="alert('引導式認知重構練習')"><div class="cog-icon">🧘</div><div class="cog-title">認知重構引導</div><div class="cog-desc">3 分鐘練習</div></div></div>
<div class="page" id="settings"><div class="settings-section"><h3>作息</h3><div class="setting-row"><span class="sr-label">作息模式</span></div><div class="setting-row"><span class="sr-label">目標睡眠時長</span></div></div><div class="settings-section"><h3>語言</h3><div class="lang-chips"><div class="lang-chip active" onclick="selectLang(this)">粵語</div><div class="lang-chip" onclick="selectLang(this)">中文</div></div></div></div>
<div class="topbar"><div class="logo">slumber<span>.</span></div><div class="icon-btn" onclick="navigate('settings')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg></div></div>
<div class="bottomnav"><div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>首頁</div><div class="nav-item" data-page="brain-dump" onclick="navigate('brain-dump')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5L7 19l-4 1 1-4L16.5 3.5z"/></svg>記錄</div><div class="nav-item" data-page="sleep" onclick="navigate('sleep')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>睡眠</div><div class="nav-item" data-page="settings" onclick="navigate('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/></svg>我的</div></div>
<button class="fab" onclick="quickDump()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>
<script>var s=1;function navigate(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});document.getElementById(id).classList.add('active');document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active')});var nav=document.querySelector('.nav-item[data-page="'+id+'"]');if(nav)nav.classList.add('active')}function onboardNext(){var steps=document.querySelectorAll('.onboard-step');if(s<steps.length){steps[s-1].classList.remove('active');s++;steps[s-1].classList.add('active')}}function finishOnboard(){navigate('dashboard')}function selectSleep(el){document.querySelectorAll('#sTs .st-option').forEach(function(o){o.classList.remove('active')});el.classList.add('active')}function quickDump(){navigate('brain-dump');setTimeout(function(){var t=document.getElementById('dumpText');if(t)t.focus()},200)}function addDump(){var t=document.getElementById('dumpText');var chat=document.getElementById('dumpChat');if(t&&t.value.trim()&&chat){var now=new Date();var time=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');var b=document.createElement('div');b.className='dump-bubble mine';b.innerHTML='<div>'+t.value.trim()+'</div><div class="bubble-time">'+time+'</div>';chat.appendChild(b);chat.scrollTop=chat.scrollHeight;t.value='';t.style.height=''}}function checkpoint(type){alert(type==='wake'?'已記錄起床時間':'已記錄準備入睡')}function selectLang(el){el.parentElement.querySelectorAll('.lang-chip').forEach(function(c){c.classList.remove('active')});el.classList.add('active')}</script></body></html>
