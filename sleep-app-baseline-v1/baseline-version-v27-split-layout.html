<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>Slumber — v27: Split Layout</title><style>
:root{--bg:#0a1218;--bg2:#0f191f;--text:#e4ecee;--text2:#8aa0a4;--text3:#4a6068;--accent:#6b9e9e;--card-bg:rgba(16,24,30,.7);--card-border:rgba(107,158,158,.08);--radius:18px;--radius-sm:12px;--radius-pill:22px;--font:'Segoe UI',system-ui,sans-serif;--topbar-h:54px;--nav-h:66px;--touch-min:44px;--input-h:62px}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}svg{fill:none}html,body{height:100%;overflow:hidden;font-family:var(--font);background:#060e12;color:var(--text)}body{display:flex;justify-content:center;align-items:center}.phone{width:390px;height:844px;background:var(--bg);border-radius:28px;position:relative;overflow:hidden;z-index:1}.topbar{position:absolute;top:0;left:0;right:0;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:100;background:rgba(10,18,24,.75);border-bottom:1px solid var(--card-border)}.topbar .logo{font-size:18px;font-weight:700}.topbar .logo span{color:var(--accent)}.bottomnav{position:absolute;bottom:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:flex-start;justify-content:space-around;background:rgba(10,18,24,.75);z-index:100;border-top:1px solid var(--card-border);padding-top:8px}.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text3);font-size:10px;padding:4px 0 8px;min-width:60px;position:relative}.nav-item::after{content:'';width:24px;height:3px;border-radius:3px;background:transparent;position:absolute;bottom:0}.nav-item.active{color:var(--accent);font-weight:600}.nav-item.active::after{background:var(--accent)}.nav-item svg{width:20px;height:20px;opacity:.5}.nav-item.active svg{opacity:1}.fab{position:absolute;bottom:calc(var(--nav-h)+18px);right:22px;width:56px;height:56px;border-radius:50%;background:rgba(107,158,158,.18);border:1.5px solid rgba(107,158,158,.22);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:120}.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2}.page{display:none;padding:14px 16px 20px;min-height:100%;position:relative;z-index:2}.page.active{display:block}.page#onboarding{padding-top:60px}#onboarding.active~.topbar,#onboarding.active~.bottomnav,#onboarding.active~.fab{display:none}#onboarding.active~.topbar{display:flex;background:transparent;border:none}#onboarding.active~.topbar .logo{opacity:0}

/* === SPLIT LAYOUT Dashboard === */
.split-panel{display:flex;gap:12px;margin-bottom:12px}
.split-left{flex:1;display:flex;flex-direction:column;gap:10px}
.split-right{flex:1;display:flex;flex-direction:column;gap:10px}
.split-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:14px}.split-card .sc-num{font-size:28px;font-weight:300;letter-spacing:-1px}.split-card .sc-lbl{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-top:2px}
.split-hero{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:16px;grid-column:1/-1;text-align:center}.split-hero .sh-num{font-size:36px;font-weight:200;letter-spacing:-1.5px}.split-hero .sh-meta{font-size:11px;color:var(--text2);margin-top:4px}
.quick-dump{display:flex;align-items:center;gap:8px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-pill);padding:4px 4px 4px 14px;margin-bottom:12px}.quick-dump input{flex:1;background:transparent;border:none;color:var(--text);font-size:13px;outline:none;font-family:var(--font)}.quick-dump .qd-send{width:36px;height:36px;border-radius:50%;background:rgba(107,158,158,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent)}.quick-dump .qd-send svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5}

.dump-chat-area{display:flex;flex-direction:column;gap:10px;max-height:100%;overflow-y:auto;padding:0 0 calc(var(--input-h)+12px) 0}.dump-bubble{max-width:85%;padding:10px 14px;border-radius:var(--radius);font-size:13px}.dump-bubble.mine{align-self:flex-end;background:rgba(107,158,158,.08);border:1px solid rgba(107,158,158,.12);border-bottom-right-radius:6px;color:var(--text)}.dump-bubble .bubble-time{font-size:8px;color:var(--text3);margin-top:3px;text-align:right}.dump-input-bar{position:absolute;bottom:0;left:0;right:0;height:var(--input-h);display:flex;gap:8px;align-items:center;background:var(--card-bg);backdrop-filter:blur(16px);border-top:1px solid var(--card-border);padding:8px 16px;z-index:50}.dump-input-bar textarea{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;outline:none;font-family:var(--font);resize:none;padding:6px 0;line-height:1.5;min-height:20px;max-height:44px}.dump-input-bar .send-round{width:40px;height:40px;border-radius:50%;background:rgba(107,158,158,.14);border:1px solid rgba(107,158,158,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent)}.dump-input-bar .send-round svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}

.sleep-pills{display:flex;gap:10px;margin-bottom:16px}.sleep-pill-btn{flex:1;padding:16px;border-radius:var(--radius-pill);text-align:center;cursor:pointer;font-weight:600;font-size:14px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card-bg);border:1.5px solid var(--card-border)}.sp-wake{border-color:rgba(107,158,158,.2);color:var(--accent)}.sp-sub{font-size:10px;opacity:.5}.tl-node{display:flex;gap:12px}.tl-dot{width:14px;height:14px;min-width:14px;border-radius:50%;border:2px solid var(--accent);margin-top:4px}.tl-dot.active{background:var(--accent)}.tl-node-content{flex:1;padding:10px 14px;border-radius:var(--radius-sm);background:var(--card-bg);border:1px solid var(--card-border);font-size:13px;margin-bottom:6px}.tl-node-content .tl-time{font-size:11px;color:var(--text3);font-weight:600}.wd-countdown{text-align:center}.wd-circle{width:150px;height:150px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:var(--card-bg);border:1px solid var(--card-border)}.wd-circle-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.wd-circle-inner .big{font-size:52px;font-weight:200}.wd-circle-inner .small{font-size:13px;color:var(--text2);margin-top:4px}.wd-cog{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer}</style></head><body><div class="phone">
<div class="page active" id="onboarding"><div class="onboard-step active" style="display:block"><div style="font-size:10px;text-transform:uppercase;letter-spacing:3px;color:var(--text3);margin-bottom:18px">01 · Sleep Well</div><div style="font-size:26px;font-weight:700;line-height:1.3;margin-bottom:10px">左右分欄<br>一眼睇晒</div><div style="width:36px;height:2px;background:var(--accent);margin-bottom:22px;opacity:.4"></div><div style="color:var(--text2);font-size:14px;line-height:1.5;margin-bottom:22px">Dashboard 分左欄（目標+趨勢）同右欄（統計+動作），充分利用橫向空間。</div><div style="display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:22px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;border:1.5px solid rgba(107,158,158,.15);background:rgba(107,158,158,.15);color:var(--accent);width:100%;font-family:var(--font)" onclick="finishOnboard()">開始使用</div></div></div>
<div class="page" id="dashboard">
<div class="split-hero"><div class="sh-num">7h 30m</div><div class="sh-meta">今晚目標 · 23:30 入睡 · 07:00 起身</div></div>
<div class="split-panel"><div class="split-left"><div class="split-card"><div class="sc-num">78</div><div class="sc-lbl">睡眠質素</div></div><div class="split-card"><div style="font-size:11px;font-weight:600;margin-bottom:6px;color:var(--text2)">趨勢</div><div style="display:flex;align-items:flex-end;gap:3px;height:28px"><div style="flex:1;background:rgba(107,158,158,.1);border-radius:3px 3px 0 0;height:60%"></div><div style="flex:1;background:rgba(107,158,158,.1);border-radius:3px 3px 0 0;height:45%"></div><div style="flex:1;background:rgba(107,158,158,.1);border-radius:3px 3px 0 0;height:70%"></div><div style="flex:1;background:var(--accent);border-radius:3px 3px 0 0;height:80%"></div></div></div></div><div class="split-right"><div class="split-card" onclick="navigate('sleep')" style="cursor:pointer;text-align:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent)"><circle cx="12" cy="12" r="5"/></svg><div style="font-size:12px;font-weight:600;margin-top:4px">起身</div></div><div class="split-card" onclick="navigate('sleep')" style="cursor:pointer;text-align:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text2)"><path d="M21 12.79A9 9 0 1111.21 3"/></svg><div style="font-size:12px;font-weight:600;margin-top:4px">準備瞓</div></div></div></div>
<div class="quick-dump"><input type="text" placeholder="將腦裡面嘅嘢寫低..."><div class="qd-send" onclick="navigate('brain-dump')"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></div></div></div>
<div class="page" id="brain-dump"><div class="dump-chat-area" id="dumpChat"></div><div class="dump-input-bar"><textarea id="dumpText" placeholder="寫低你嘅雜念..." rows="1" oninput="this.style.height='';this.style.height=Math.min(this.scrollHeight,44)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();addDump()}"></textarea><div class="send-round" onclick="addDump()"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/></svg></div></div></div>
<div class="page" id="sleep"><div class="sleep-pills"><div class="sleep-pill-btn sp-wake" onclick="checkpoint('wake')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/></svg>起身<span class="sp-sub">記錄起床</span></div><div class="sleep-pill-btn" onclick="checkpoint('sleep')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>準備瞓<span class="sp-sub">睡前放鬆</span></div></div><div class="tl-node"><div class="tl-dot active"></div><div class="tl-node-content"><div class="tl-time">23:45</div><div>準備入睡</div></div></div><div class="tl-node" onclick="alert('手動添加記錄')"><div class="tl-dot" style="border-color:var(--text3)"></div><div class="tl-node-content" style="opacity:.35;cursor:pointer"><div class="tl-time" style="color:var(--text3)">+</div><div style="color:var(--text3)">手動添加記錄</div></div></div></div>
<div class="page" id="wind-down"><div class="wd-countdown" style="margin-bottom:22px"><div class="wd-circle"><div class="wd-circle-inner"><span class="big">10</span><span class="small">mins left</span></div></div></div><div class="wd-cog" onclick="alert('引導式認知重構練習')"><div style="font-size:28px;margin-bottom:8px">🧘</div><div style="font-size:15px;font-weight:600">認知重構引導</div><div style="font-size:12px;color:var(--text2);margin-top:4px">3 分鐘練習</div></div></div>
<div class="page" id="settings"><div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:16px;margin:14px">作息設定</div></div>
<div class="topbar"><div class="logo">slumber<span>.</span></div></div>
<div class="bottomnav"><div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/></svg>首頁</div><div class="nav-item" data-page="brain-dump" onclick="navigate('brain-dump')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/></svg>記錄</div><div class="nav-item" data-page="sleep" onclick="navigate('sleep')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3"/></svg>睡眠</div><div class="nav-item" data-page="settings" onclick="navigate('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/></svg>我的</div></div>
<button class="fab" onclick="quickDump()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>
<script>function navigate(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});document.getElementById(id).classList.add('active');document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active')});var nav=document.querySelector('.nav-item[data-page="'+id+'"]');if(nav)nav.classList.add('active')}function finishOnboard(){navigate('dashboard')}function quickDump(){navigate('brain-dump');setTimeout(function(){var t=document.getElementById('dumpText');if(t)t.focus()},200)}function addDump(){var t=document.getElementById('dumpText');var c=document.getElementById('dumpChat');if(t&&t.value.trim()&&c){var n=new Date();var b=document.createElement('div');b.className='dump-bubble mine';b.innerHTML='<div>'+t.value.trim()+'</div><div class="bubble-time">'+n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0')+'</div>';c.appendChild(b);c.scrollTop=c.scrollHeight;t.value='';t.style.height=''}}function checkpoint(type){alert(type==='wake'?'已記錄起床時間':'已記錄準備入睡')}</script></body></html>
